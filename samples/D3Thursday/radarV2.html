<html>
<head>
  <!-- Import D3.js -->
  <script type="text/javascript" src="https://d3js.org/d3.v5.min.js"></script>

  <!-- Import d3-tip -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3-tip/0.9.1/d3-tip.min.js"></script>

  <!-- Import utilities -->
  <script type="text/javascript" src="https://sas-viya.github.io/dv-example-common-files/messagingUtil.js"></script>
  <script type="text/javascript" src="https://sas-viya.github.io/dv-example-common-files/contentUtil.js"></script>
</head>
<body>
<style type="text/css">
  /* MODIFICAÇÃO: Margens e preenchimentos zerados */
  html, body, svg {
    overflow: hidden;
    margin: 0px;
    padding: 0px;
    width: 100%;
    height: 100%;
  }

  /* MODIFICAÇÃO: Fonte alterada para AvenirNext e tamanho base definido */
  text {
    font-family: AvenirNext;
    font-size: 13px;
  }

  .legend-title {
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: hanging;
  }

  /* MODIFICAÇÃO: Tamanho da fonte da legenda ajustado */
  .legend-text {
    font-size: 0.8em;
    dominant-baseline: central;
  }

  .legend-rect {
    stroke-width: 1;
  }

  .g-legend-entry {
    cursor: pointer;
  }

  .g-legend-entry.selected .legend-text {
    font-weight: bold;
  }

  .g-legend-entry.selected .legend-rect {
    stroke-width: 2px;
  }

  /* MODIFICAÇÃO: Espessura da linha aumentada */
  .data-path {
    pointer-events: none;
    stroke-width: 4;
  }

  .measure-label {
    dominant-baseline: hanging;
  }

  .d3-tip {
    pointer-events: none !important;
    background: white;
    position: relative;
    border: 1px solid #C4C4C4;
    border-radius: 2px;
  }

  /* Create arrow on tooltip */
  .d3-tip.n:before, .d3-tip.ne:before, .d3-tip.nw:before, .d3-tip.s:before, .d3-tip.se:before, .d3-tip.sw:before {
    content: "";
    position: absolute;
    border-style: solid;
    border-width: 5px 10px 5px 0;
    border-color: transparent #C4C4C4;
    transform-origin: 0% 0%;
  }

  .d3-tip.n:after, .d3-tip.ne:after, .d3-tip.nw:after, .d3-tip.s:after, .d3-tip.se:after, .d3-tip.sw:after {
    content: "";
    position: absolute;
    border-style: solid;
    border-width: 4px 8px 4px 0;
    border-color: transparent #fff;
    transform-origin: 0% 0%;
  }

  /* Move the arrow depending on direction */
  .d3-tip.n:before, .d3-tip.n:after {
    top: 100%;
    left: 50%;
    transform: rotate(-90deg) translate(-10px, -5px);
  }

  .d3-tip.n:after {
    transform: rotate(-90deg) translate(-7px, -4px);
  }

  .d3-tip.ne:before, .d3-tip.ne:after {
    top: 100%;
    left: 0%;
    transform: rotate(-45deg) translate(-6px, -5px);
  }

  .d3-tip.ne:after {
    transform: rotate(-45deg) translate(-3px, -4px);
  }

  .d3-tip.nw:before, .d3-tip.nw:after {
    top: 100%;
    left: 100%;
    transform: rotate(-135deg) translate(-6px, -5px);
  }

  .d3-tip.nw:after {
    transform: rotate(-135deg) translate(-3px, -4px);
  }

  .d3-tip.s:before, .d3-tip.s:after {
    top: 0%;
    left: 50%;
    transform: rotate(90deg) translate(-10px, -5px);
  }

  .d3-tip.s:after {
    transform: rotate(90deg) translate(-7px, -4px);
  }

  .d3-tip.se:before, .d3-tip.se:after {
    top: 0%;
    left: 0%;
    transform: rotate(45deg) translate(-6px, -5px);
  }

  .d3-tip.se:after {
    transform: rotate(45deg) translate(-3px, -4px);
  }

  .d3-tip.sw:before, .d3-tip.sw:after {
    top: 0%;
    left: 100%;
    transform: rotate(135deg) translate(-6px, -5px);
  }

  .d3-tip.sw:after {
    transform: rotate(135deg) translate(-3px, -4px);
  }

  /* Style tip content */
  .d3-tip-content {
    white-space: nowrap;
    font-family: AvenirNext;
    text-align: left;
  }
</style>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", function() {
  /******************************************************* Declare variables *******************************************************/

  // Static data variables
  const SVG_ID = "radar"; // ID of SVG element
  const SAMPLE_MESSAGE = {
    version: "1",
    resultName: "dd55",
    rowCount: 18,
    availableRowCount: 18,
    data: [
      ["Hybrid", "Cylinders", 3.6666666666666665, "BEST12.2"],
      ["Hybrid", "MPG (City)", 55, "BEST12.2"],
      ["Hybrid", "MSRP", 19920, "DOLLAR12.2"],
      ["Sedan", "Cylinders", 5.580152671755725, "BEST12.2"],
      ["Sedan", "MPG (City)", 21.083969465648856, "BEST12.2"],
      ["Sedan", "MSRP", 29773.618320610687, "DOLLAR12.2"],
      ["Sports", "Cylinders", 6.340425531914893, "BEST12.2"],
      ["Sports", "MPG (City)", 18.408163265306122, "BEST12.2"],
      ["Sports", "MSRP", 53387.06122448979, "DOLLAR12.2"],
      ["SUV", "Cylinders", 6.566666666666666, "BEST12.2"],
      ["SUV", "MPG (City)", 16.1, "BEST12.2"],
      ["SUV", "MSRP", 34790.25, "DOLLAR12.2"],
      ["Truck", "Cylinders", 6.25, "BEST12.2"],
      ["Truck", "MPG (City)", 16.5, "BEST12.2"],
      ["Truck", "MSRP", 24941.375, "DOLLAR12.2"],
      ["Wagon", "Cylinders", 5.3, "BEST12.2"],
      ["Wagon", "MPG (City)", 21.1, "BEST12.2"],
      ["Wagon", "MSRP", 28840.533333333333, "DOLLAR12.2"]
    ],
    columns: [
      { name: "bi173", label: "Type", type: "string" },
      { name: "bi174", label: "Metric", type: "string" },
      { name: "bi175", label: "Measure", type: "number", usage: "quantitative", aggregation: "sum", format: { name: "BEST", width: 12, precision: 0, formatString: "BEST12." } },
      { name: "bi176", label: "Format", type: "string" }
    ]
  }; // Sample data message to render graph outside of VA for debugging
  const OPACITY = {
    fill: { focus: 0.6, default: 0.2, unfocus: 0.1 },
    stroke: { focus: 1, default: 0.6, unfocus: 0.2 }
  }; // Various opacity values used during rendering

  // Dynamic data variables
  let VA_MESSAGE; // Data message to be received from VA
  let VA_RESULT_NAME; // Result name required to send messages back to VA
  let DATA; // Data to be parsed from VA data message
  let OLD_DATA; // Data from previous render to track duplicate point
  let METADATA = []; // Metadata to be parsed from VA data message
  let OLD_METADATA; // Metadata from previous render to track duplicate point
  let SELECTED_CATEGORY; // Currently selected category
  let LAST_TRANSITION_END = Date.now(); // Time of last transition used to time transition callbacks

  // Static dimension variables
  const TRANS_TIME = 500; // Duration of major transitions
  const TRANS_DELAY = 20; // Small buffer to ensure all callbacks have finished before allowing new transition
  const HOVER_TRANS_TIME = 100; // Duration of focus transitions
  const ENTER_REMOVE_TRANS_TIME = 200; // Duration of enter and exit transitions for data points and grid lines
  
  // MODIFICAÇÃO: Espaçamento da label da métrica zerado
  const MEASURE_LABEL_PADDING = 0;

  // Dynamic dimension variables
  let WIDTH; // Width of SVG element
  let HEIGHT; // Height of SVG element
  let RADIUS; // Radius of radar chart
  let OLD_RADIUS; // Previous radius of chart used for tweening height changes
  let DELTA_ANGLE; // Angle in radians between each measure on circle
  let TOP_PAD; // Vertical padding for measure labels
  let SIDE_PAD; // Horizontal padding for measure labels

  // Selection and d3 variables
  const SCALED_FORMAT = d3.format("3.0f"); // Format for scaled version of measure displayed in tooltip
  d3.selection.prototype.moveToFront = function() {
    return this.each(function() { this.parentNode.appendChild(this); });
  };
  let SVG; // SVG selection
  let G_CHART_AREA; // Chart area group selection
  let G_GRID; // Grid lines group selection
  let GRID_LINES; // Grid lines data-join
  let GRID_CIRCLES; // Grid circles data-join
  let MEASURE_LABELS; // Measure labels data-join
  let DATA_PATHS; // Data paths data-join
  let DATA_POINTS; // Data points data-join

  // Legend variables
  // MODIFICAÇÃO: Espaçamentos da legenda zerados/reduzidos
  const LEG = {
    topPad: 5, // Padding between chart and legend title
    titlePad: 0, // Padding between legend title bottom and first row of legend
    rowPad: 0, // Padding between legend rows
    rectWidth: 12, // Width of legend rects
    rectPad: 0, // Padding between legend rect and legend text
    textPad: 0, // Padding after legend text
    title: undefined,
    data: undefined,
    elPos: undefined,
    height: undefined,
    groupSelection: undefined,
    titleDataJoin: undefined,
    groupDataJoin: undefined
  };

  // Tooltip variables
  const TIP = {
    self: undefined, // Tooltip object
    dir: "n" // Tooltip direction
  };

  // Gradient variables
  // MODIFICAÇÃO: Paleta de cores verde aplicada
  const GRAD = {
    fill: {},
    stroke: {},
    fillScale: d3.scaleOrdinal(['#66BB6A', '#43A047', '#2E7D32', '#1B5E20', '#A5D6A7', '#81C784']),
    strokeScale: d3.scaleOrdinal(['#66BB6A', '#43A047', '#2E7D32', '#1B5E20', '#A5D6A7', '#81C784']),
    data: undefined,
    defsSelection: undefined,
    gradsDataJoin: undefined
  };

  /*************************************************** Setup Callback Functions ***************************************************/
  if (window.va) {
    va.messagingUtil.setOnDataReceivedCallback(handleCallback);
    va.contentUtil.setupResizeListener(drawElements);
  } else if (inIframe()) {
    console.log("Could not find VA libraries. Trying to register for postMessage events.");
    window.addEventListener("message", function(event) {
        if (event.data && event.data.hasOwnProperty("resultName")) {
            handleCallback(event.data);
        }
    });
    window.addEventListener('resize', function(){
        drawElements();
    });
   } else {
    onDataReceived(SAMPLE_MESSAGE);
    window.addEventListener('resize', function(){
        drawElements();
    });
  }
 

  /****************************************************** Callback Functions ******************************************************/

  function handleCallback(messageFromVA) {
    if (LAST_TRANSITION_END > Date.now()) {
      setTimeout(function() {
        onDataReceived(messageFromVA);
      }, LAST_TRANSITION_END - Date.now());
      LAST_TRANSITION_END = LAST_TRANSITION_END + TRANS_TIME + TRANS_DELAY;
    } else {
      onDataReceived(messageFromVA);
      LAST_TRANSITION_END = Date.now() + TRANS_TIME + TRANS_DELAY;
    }
  }

  function onDataReceived(messageFromVA) {
    VA_MESSAGE = messageFromVA;
    VA_RESULT_NAME = messageFromVA.resultName;

    if (window.va && !va.contentUtil.validateRoles(messageFromVA, ["string", "string", "number", "string"], ["number"])) {
      va.messagingUtil.postInstructionalMessage(
        VA_RESULT_NAME,
        "D3 Radar Chart expects columns to be assigned in this order:\n 1. Category (string)\n 2. Metric Name (string)\n 3. Metric Value (number)\n 4. Metric Format (string)"
      );
      return;
    }

    const nestedData = d3.nest().key(function(d) { return d[1]; }).entries(VA_MESSAGE.data);
    const numMeasures = nestedData.length;

    OLD_METADATA = METADATA;
    DELTA_ANGLE = (2 * Math.PI) / numMeasures;
    METADATA = { category: VA_MESSAGE.columns[0].label, metrics: {} };

    for (let i = 0; i < numMeasures; i++) {
      METADATA.metrics[nestedData[i].key] = {
        metric: nestedData[i].key,
        angle: i * DELTA_ANGLE,
        format: translateFormat(VA_MESSAGE.data[i][3]),
        maximum: d3.max(VA_MESSAGE.data, function(d) {
          return (d[1] == nestedData[i].key) ? d[2] : Number.MIN_VALUE;
        })
      };
    }

    let datum, metric;
    OLD_DATA = DATA;
    DATA = [];
    for (let i = 0; i < VA_MESSAGE.data.length / numMeasures; i++) {
      datum = { category: VA_MESSAGE.data[i * numMeasures][0], id: "id-" + VA_MESSAGE.data[i * numMeasures][0].replace(/[\W]/g, "_"), metrics: [] };
      for (let j = 0; j < numMeasures; j++) {
        metric = {
          metric: VA_MESSAGE.data[i * numMeasures + j][1],
          measure: VA_MESSAGE.data[i * numMeasures + j][2],
          scaledMeasure: VA_MESSAGE.data[i * numMeasures + j][2] / METADATA.metrics[VA_MESSAGE.data[i * numMeasures + j][1]].maximum
        };
        datum.metrics.push(metric);
      }
      DATA.push(datum);
    }

    LEG.title = METADATA.category;
    LEG.data = DATA.map(function(d) { return { key: d.category, id: d.id }; });
    GRAD.data = LEG.data;

    if (d3.select("#" + SVG_ID).empty()) {
      drawElements();
    } else {
      updateElements();
    }
  }

  function drawElements() {
    if (!DATA) return;

    WIDTH = document.body.clientWidth;
    HEIGHT = document.body.clientHeight;

    d3.select("body").selectAll("#" + SVG_ID).data([DATA]).enter().append("svg").attr("id", SVG_ID).on("click", legendDeselectAll)
      .each(function() {
        TIP.self = d3.tip().attr("class", "d3-tip").offset([-8, 0])
          .html(function(d) {
            return "<table class='d3-tip-content'> <tr> <td> " + METADATA.category + ":\t</td> <td>" + d.category + "</td> </tr>" +
              "<tr> <td> " + d.metric + ":\t</td> <td>" + METADATA.metrics[d.metric].format(d.measure) + "</td> </tr>" +
              "<tr> <td> " + d.metric + " Scaled:\t</td> <td>" + SCALED_FORMAT(d.scaledMeasure * 100) + "</td> </tr> </table>";
          });
        d3.select(this).call(TIP.self);
      });

    SVG = d3.select("#" + SVG_ID);
    SVG.selectAll(".gradient-defs").data([DATA]).enter().append("defs").classed("gradient-defs", true);
    GRAD.defsSelection = SVG.select(".gradient-defs");

    defineGradients();
    calculatePadding();
    calculateLegendDimensions();
    drawLegend();

    OLD_RADIUS = RADIUS;
    RADIUS = Math.min(WIDTH - 2 * SIDE_PAD, HEIGHT - LEG.height - 2 * TOP_PAD) / 2;

    SVG.selectAll(".g-chart-area").data([DATA]).enter().append("g").classed("g-chart-area", true);
    G_CHART_AREA = SVG.select(".g-chart-area").attr("transform", "translate(" + WIDTH / 2 + ", " + (TOP_PAD + RADIUS) + ")");
    G_CHART_AREA.selectAll(".g-grid").data([DATA]).enter().append("g").classed("g-grid", true);
    G_GRID = G_CHART_AREA.select(".g-grid");

    GRID_LINES = G_GRID.selectAll(".grid-line").data(Object.values(METADATA.metrics), function(d) { return d.metric; });
    GRID_LINES.enter().append("line").classed("grid-line", true).attr("stroke", "#C4C4C4").attr("data-angle", function(d) { return d.angle; })
      .attr("x1", 0).attr("y1", 0).merge(GRID_LINES).attr("x2", function(d) { return RADIUS * Math.sin(d.angle); }).attr("y2", function(d) { return -RADIUS * Math.cos(d.angle); });

    GRID_CIRCLES = G_GRID.selectAll(".grid-circle").data([0.2, 0.4, 0.6, 0.8, 1]);
    GRID_CIRCLES.enter().append("circle").classed("grid-circle", true).attr("fill", "none").attr("stroke", "#E4E4E4")
      .attr("cx", 0).attr("cy", 0).merge(GRID_CIRCLES).attr("r", function(d) { return d * RADIUS; });

    MEASURE_LABELS = G_CHART_AREA.selectAll(".measure-label").data(Object.values(METADATA.metrics), function(d) { return d.metric; });
    MEASURE_LABELS.enter().append("text").classed("measure-label", true).text(function(d) { return d.metric; })
      .attr("data-angle", function(d) { return d.angle; })
      .attr("dx", function(d) {
        return (d.angle == 0 || d.angle == Math.PI) ? -this.getBBox().width / 2 + "px" : (d.angle > 0 && d.angle < Math.PI) ? 0 + "px" : -this.getBBox().width + "px";
      })
      .attr("dy", function(d) {
        return (d.angle == Math.PI / 2 || d.angle == (3 * Math.PI) / 2) ? -this.getBBox().height / 2 + "px" : (d.angle > Math.PI / 2 && d.angle < (3 * Math.PI) / 2) ? 0 + "px" : -this.getBBox().height + "px";
      })
      .merge(MEASURE_LABELS).attr("x", function(d) { return (RADIUS + MEASURE_LABEL_PADDING) * Math.sin(d.angle); })
      .attr("y", function(d) { return -(RADIUS + MEASURE_LABEL_PADDING) * Math.cos(d.angle); });

    DATA_PATHS = G_CHART_AREA.selectAll(".data-path").data(DATA, function(d) { return d.category; });
    DATA_PATHS.enter().append("path").classed("data-path", true)
      .attr("id", function(d) { return d.category + "-path"; })
      .attr("fill", function(d) { return GRAD.fill[d.category] ? GRAD.fill[d.category] : GRAD.fillScale(d.category); })
      // MODIFICAÇÃO: fill-opacity alterado para 0 para remover o preenchimento
      .attr("fill-opacity", 0)
      .attr("stroke", function(d) { return GRAD.stroke[d.category] ? GRAD.stroke[d.category] : GRAD.strokeScale(d.category); })
      .attr("stroke-opacity", function(d) { return getOpacity(d.category, OPACITY.stroke); })
      .merge(DATA_PATHS).attr("d", function(d) {
        const dPath = d; const points = []; let path = "M "; let x, y;
        for (let j = 0; j < dPath.metrics.length; j++) {
          x = RADIUS * dPath.metrics[j].scaledMeasure * Math.sin(j * DELTA_ANGLE);
          y = -RADIUS * dPath.metrics[j].scaledMeasure * Math.cos(j * DELTA_ANGLE);
          points.push({ category: dPath.category, metric: dPath.metrics[j].metric, measure: dPath.metrics[j].measure, scaledMeasure: dPath.metrics[j].scaledMeasure, x: x, y: y });
          path += x + "," + y + (j == dPath.metrics.length - 1 ? " Z" : " L ");
        }

        DATA_POINTS = G_CHART_AREA.selectAll(".data-point").filter(function(d) { return dPath.category == d.category; }).data(points, function(d) { return d.metric; });
        DATA_POINTS.enter().append("circle").classed("data-point", true)
          .attr("fill", GRAD.fill[dPath.category] ? GRAD.fill[dPath.category] : GRAD.fillScale(dPath.category))
          .attr("fill-opacity", getOpacity(dPath.category, OPACITY.stroke))
          .on("mouseover", function(d) { TIP.self.direction("n").offset([-8, 0]).show(d, this).direction(getTipDirection()).offset(getTipOffset()).show(d, this); })
          .on("mouseout", TIP.self.hide)
          .merge(DATA_POINTS).attr("cx", function(d) { return d.x; }).attr("cy", function(d) { return d.y; }).attr("r", 4);
        return path;
      });

    d3.select(".tip").style("top", function() { return RADIUS + TOP_PAD - this.height / 2 + "px"; }).style("left", function() { return WIDTH / 2 - this.width / 2 + "px"; });
  }

  function updateElements() {
    calculatePadding();
    defineGradients();
    calculateLegendDimensions();
    updateLegend();

    OLD_RADIUS = RADIUS;
    RADIUS = Math.min(WIDTH - 2 * SIDE_PAD, HEIGHT - LEG.height - 2 * TOP_PAD) / 2;

    G_CHART_AREA.transition().duration(TRANS_TIME).attr("transform", "translate(" + WIDTH / 2 + ", " + (TOP_PAD + RADIUS) + ")");

    GRID_LINES = G_GRID.selectAll(".grid-line").data(Object.values(METADATA.metrics), function(d) { return d.metric; });
    GRID_LINES.transition().duration(TRANS_TIME).attrTween("x2", function(d) { const startAngle = OLD_METADATA.metrics[d.metric].angle; return xTween(OLD_RADIUS, RADIUS, startAngle, d.angle); })
      .attrTween("y2", function(d) { const startAngle = OLD_METADATA.metrics[d.metric].angle; return yTween(OLD_RADIUS, RADIUS, startAngle, d.angle); });
    GRID_LINES.enter().append("line").classed("grid-line", true).attr("stroke", "#C4C4C4").attr("data-angle", function(d) { return d.angle; }).attr("x1", 0).attr("y1", 0)
      .attr("x2", function(d) { return RADIUS * Math.sin(d.angle); }).attr("y2", function(d) { return -RADIUS * Math.cos(d.angle); })
      .style("opacity", 0).transition().delay(TRANS_TIME - ENTER_REMOVE_TRANS_TIME).duration(ENTER_REMOVE_TRANS_TIME).style("opacity", 1);
    GRID_LINES.exit().transition().duration(ENTER_REMOVE_TRANS_TIME).style("opacity", 0).remove();

    GRID_CIRCLES = G_GRID.selectAll(".grid-circle");
    GRID_CIRCLES.transition().duration(TRANS_TIME).attr("r", function(d) { return d * RADIUS; });

    MEASURE_LABELS = G_CHART_AREA.selectAll(".measure-label").data(Object.values(METADATA.metrics), function(d) { return d.metric; });
    MEASURE_LABELS.transition().duration(TRANS_TIME).attr("dx", function(d) { return (d.angle == 0 || d.angle == Math.PI) ? -this.getBBox().width / 2 + "px" : (d.angle > 0 && d.angle < Math.PI) ? 0 + "px" : -this.getBBox().width + "px"; })
      .attr("dy", function(d) { return (d.angle == Math.PI / 2 || d.angle == (3 * Math.PI) / 2) ? -this.getBBox().height / 2 + "px" : (d.angle > Math.PI / 2 && d.angle < (3 * Math.PI) / 2) ? 0 + "px" : -this.getBBox().height + "px"; })
      .attrTween("x", function(d) { const startAngle = OLD_METADATA.metrics[d.metric].angle; return xTween(OLD_RADIUS + MEASURE_LABEL_PADDING, RADIUS + MEASURE_LABEL_PADDING, startAngle, d.angle); })

    MEASURE_LABELS.enter().append("text").classed("measure-label", true).text(function(d) { return d.metric; }).attr("dx", function(d) { return (d.angle == 0 || d.angle == Math.PI) ? -this.getBBox().width / 2 + "px" : (d.angle > 0 && d.angle < Math.PI) ? 0 + "px" : -this.getBBox().width + "px"; })

      .each(function(d, i) {

        d.entered = oldMetrics.length < metrics.length;

            for (let j = 0; j < oldData.length; j++) {

          });

      })
      .transition().duration(TRANS_TIME).attr("d", function(d) {

        for (let j = 0; j < dPath.metrics.length; j++) {

          x = RADIUS * dPath.metrics[j].scaledMeasure * Math.sin(j * DELTA_ANGLE); y = -RADIUS * dPath.metrics[j].scaledMeasure * Math.cos(j * DELTA_ANGLE);
          points.push({ category: dPath.category, metric: dPath.metrics[j].metric, measure: dPath.metrics[j].measure, scaledMeasure: dPath.metrics[j].scaledMeasure, x: x, y: y });
          path += x + "," + y + (j == dPath.metrics.length - 1 ? " Z" : " L ");
        }

        DATA_POINTS = G_CHART_AREA.selectAll(".data-point").filter(function(d) { return dPath.category == d.category; }).data(points, function(d) { return d.metric; });
        DATA_POINTS.attr("fill", GRAD.fill[dPath.category] ? GRAD.fill[dPath.category] : GRAD.fillScale(dPath.category)).transition().duration(TRANS_TIME).attr("cx", function(d) { return d.x; }).attr("cy", function(d) { return d.y; });
        DATA_POINTS.enter().append("circle").classed("data-point", true).attr("fill", GRAD.fill[dPath.category] ? GRAD.fill[dPath.category] : GRAD.fillScale(dPath.category)).attr("cx", function(d) { return d.x; }).attr("cy", function(d) { return d.y; }).attr("r", 4)
          .attr("fill-opacity", getOpacity(dPath.category, OPACITY.stroke)).on("mouseover", function(d) { TIP.self.direction("n").offset([-8, 0]).show(d, this).direction(getTipDirection()).offset(getTipOffset()).show(d, this); }).on("mouseout", TIP.self.hide)
          .style("opacity", 0).transition().delay(TRANS_TIME - ENTER_REMOVE_TRANS_TIME).duration(ENTER_REMOVE_TRANS_TIME).style("opacity", 1);

        return path;

      // MODIFICAÇÃO: fill-opacity alterado para 0 para remover o preenchimento

      .attr("stroke", function(d) { return GRAD.stroke[d.category] ? GRAD.stroke[d.category] : GRAD.strokeScale(d.category); })
      .attr("stroke-opacity", function(d) { return getOpacity(d.category, OPACITY.stroke); })
      .attr("d", function(d) {

        for (let j = 0; j < d.metrics.length; j++) {

        DATA_POINTS = G_CHART_AREA.selectAll(".data-point").filter(function(d) { return dPath.category == d.category; }).data(points, function(d) { return d.metric; });

  /******************************************************* Helper Functions *******************************************************/

  function inIframe() { try { return window.self !== window.top; } catch (e) { return true; } }

  function calculateLegendDimensions() {
    let titleHeight = 0; // MODIFICAÇÃO: Altura do título zerada pois o título foi removido

    const textWidths = []; let textHeight;
    SVG.selectAll(".dummyText").data(LEG.data).enter().append("text").classed("legend-text", true).text(function(d) { return d.key; }).style("font-weight", "bold")
      .each(function() { textHeight = this.getBBox().height; textWidths.push(this.getComputedTextLength()); this.remove(); });

    const rows = []; const rowSums = []; let rowSum; let row = 0;
    for (let i = 0; i < textWidths.length; i++) {
      rowSum = textWidths[i] + LEG.rectWidth + LEG.rectPad + LEG.textPad;
      rows.push(row);
      while (rowSum + textWidths[i + 1] + LEG.rectWidth + LEG.rectPad + LEG.textPad <= WIDTH && i + 1 < textWidths.length) { i++; rowSum += textWidths[i] + LEG.rectWidth + LEG.rectPad + LEG.textPad; rows.push(row); }
      rowSums.push(rowSum);
      row++;
    }

    LEG.elPos = [];
    for (let i = 0; i < textWidths.length; i++) {
      LEG.elPos.push({
        x: (i == 0 || rows[i - 1] != rows[i]) ? WIDTH / 2 - rowSums[rows[i]] / 2 : LEG.elPos[i - 1].x + textWidths[i - 1] + LEG.rectWidth + LEG.rectPad + LEG.textPad,
        y: titleHeight + LEG.titlePad + rows[i] * (textHeight + LEG.rowPad)
      });
    }
    LEG.height = LEG.elPos.length > 0 ? LEG.elPos[LEG.elPos.length - 1].y + textHeight + LEG.rowPad : 0;
  }

  function drawLegend() {
    SVG.selectAll(".g-legend").data([LEG.title]).enter().append("g").classed("g-legend", true);
    LEG.groupSelection = SVG.select(".g-legend");
  
    // MODIFICAÇÃO: Código do título da legenda removido
  
    LEG.groupDataJoin = LEG.groupSelection.selectAll(".g-legend-entry").data(LEG.data, function(d) { return d.id; }).enter().append("g").classed("g-legend-entry", true)
      .attr("id", function(d) { return d.id + "-legend-entry"; }).on("click", function(d, i) { legendSelect(d, i, this); });
  
    LEG.groupSelection.selectAll(".g-legend-entry").data(LEG.data, function(d) { return d.id; })
      .attr("transform", function(d, i) { return "translate(" + LEG.elPos[i].x + ", " + LEG.elPos[i].y + ")"; });

    LEG.groupDataJoin.append("rect").classed("legend-rect", true).attr("width", LEG.rectWidth).attr("height", LEG.rectWidth)
      .attr("fill", function(d) { return "url(#" + d.id + "-gradient)"; })
      .attr("stroke", function(d) { return GRAD.stroke[d.key] ? GRAD.stroke[d.key] : GRAD.strokeScale(d.key); });

    LEG.groupDataJoin.append("text").classed("legend-text", true).text(function(d) { return d.key; }).attr("x", LEG.rectWidth + LEG.rectPad).attr("y", LEG.rectWidth / 2);

    LEG.groupSelection.attr("transform", function() { return "translate(0, " + (HEIGHT - LEG.height) + ")"; });
  }

  function updateLegend() {
    LEG.groupDataJoin = LEG.groupSelection.selectAll(".g-legend-entry").data(LEG.data, function(d) { return d.key; });

    LEG.groupDataJoin.exit().each(function() { if (d3.select(this).classed("selected")) { legendDeselectAll(); } }).transition().duration(TRANS_TIME).style("opacity", 0).remove();
    LEG.groupDataJoin.transition().duration(TRANS_TIME).attr("transform", function(d, i) { return "translate(" + LEG.elPos[i].x + ", " + LEG.elPos[i].y + ")"; }).style("opacity", 1);

    let enter = LEG.groupDataJoin.enter().append("g").classed("g-legend-entry", true).attr("id", function(d) { return d.id + "-legend-entry"; })
      .attr("transform", function(d, i) { return "translate(" + LEG.elPos[i].x + ", " + LEG.elPos[i].y + ")"; }).on("click", function(d, i) { legendSelect(d, i, this); });

    enter.append("rect").classed("legend-rect", true).attr("width", LEG.rectWidth).attr("height", LEG.rectWidth).attr("fill", function(d) { return "url(#" + d.id + "-gradient)"; })
      .attr("stroke", function(d) { return GRAD.stroke[d.key] ? GRAD.stroke[d.key] : GRAD.strokeScale(d.key); })
      .style("opacity", 0).transition().duration(TRANS_TIME).style("opacity", 1);
  
    enter.append("text").classed("legend-text", true).text(function(d) { return d.key; }).attr("x", LEG.rectWidth + LEG.rectPad).attr("y", LEG.rectWidth / 2)
      .style("opacity", 0).transition().duration(TRANS_TIME).style("opacity", 1);

    LEG.groupSelection.transition().duration(TRANS_TIME).attr("transform", function() { return "translate(0, " + (HEIGHT - LEG.height) + ")"; });
  }

  function getTipDirection() {
    const tip = d3.select(".d3-tip").node(); const w = tip.clientWidth; const left = tip.offsetLeft; const top = tip.offsetTop; let dir;
    dir = top < 0 ? "s" : "n";
    if (left < 0) { dir += "e"; } else if (left + w > WIDTH) { dir += "w"; }
    TIP.dir = dir; return dir;
  }

  function getTipOffset() {
    let offset;
    switch (TIP.dir) {
      case "n": offset = [-8, 0]; break;
      case "ne": offset = [-5, 0]; break;
      case "nw": offset = [-5, 0]; break;
      case "s": offset = [8, 0]; break;
      case "se": offset = [5, 0]; break;
      case "sw": offset = [5, 0]; break;
    }
    return offset;
  }

  function defineGradients() {
    GRAD.gradsDataJoin = GRAD.defsSelection.selectAll(".gradient").data(GRAD.data, function(d) { return d.id; });
    GRAD.gradsDataJoin.enter().append("linearGradient").classed("gradient", true).attr("id", function(d) { return d.id + "-gradient"; })
      .attr("x1", "0%").attr("x2", "100%").attr("y1", "50%").attr("y2", "50%").each(function(d) {
        d3.select(this).append("stop").attr("class", "start").attr("offset", "0%").attr("stop-color", function() { return GRAD.fill[d.key] ? GRAD.fill[d.key] : GRAD.fillScale(d.key); }).attr("stop-opacity", 1);
        d3.select(this).append("stop").attr("class", "end").attr("offset", "100%").attr("stop-color", function() { return GRAD.fill[d.key] ? GRAD.fill[d.key] : GRAD.fillScale(d.key); }).attr("stop-opacity", 0.7);
      });
  }

  function calculatePadding() {
    let height; let width = 0;
    SVG.selectAll(".dummyText").data(Object.values(METADATA.metrics)).enter().append("text").classed("measure-label", true).text(function(d) { return d.metric; })
      .each(function() { height = this.getBBox().height; width = Math.max(this.getComputedTextLength(), width); this.remove(); });
    SIDE_PAD = width + 2 * MEASURE_LABEL_PADDING;
    TOP_PAD = height + 2 * MEASURE_LABEL_PADDING;
  }

  function getOpacity(category, opacity) { return SELECTED_CATEGORY ? (category == SELECTED_CATEGORY ? opacity.focus : opacity.unfocus) : opacity.default; }

  function translateFormat(formatString) {
    if (formatString.indexOf(".") == formatString.length - 1) formatString += 0;
    if (formatString.includes("DOLLAR")) return d3.format(formatString.replace("DOLLAR", "$").replace(".", ",.") + "f");
    else if (formatString.includes("COMMA")) return d3.format(formatString.replace("COMMA", "").replace(".", ",.") + "f");
    else if (formatString.includes("F")) return d3.format(formatString.replace("F", "") + "f");
    else if (formatString.includes("BEST")) return d3.format(formatString.replace("BEST", "") + "f");
    else if (formatString.includes("PERCENT")) return d3.format(formatString.replace("PERCENT", "").replace(".", ",.") + "%");
  }

  function legendDeselectAll() {
    SELECTED_CATEGORY = null;
    LEG.groupSelection.selectAll(".g-legend-entry").classed("selected", false);
    d3.selectAll(".data-path").transition("select").duration(HOVER_TRANS_TIME).attr("fill-opacity", 0).attr("stroke-opacity", OPACITY.stroke.default);
    d3.selectAll(".data-point").transition("select").duration(HOVER_TRANS_TIME).attr("fill-opacity", OPACITY.stroke.default);
  }

  function legendSelect(datum, index, el) {
    SELECTED_CATEGORY = datum.key;
    d3.event.stopPropagation();
    LEG.groupSelection.selectAll(".g-legend-entry").classed("selected", false);
    d3.selectAll(".data-path").transition("select").duration(HOVER_TRANS_TIME).filter(function(d) { return datum.key != d.category; }).attr("fill-opacity", 0).attr("stroke-opacity", OPACITY.stroke.unfocus);
    d3.selectAll(".data-point").transition("select").duration(HOVER_TRANS_TIME).filter(function(d) { return datum.key != d.category; }).attr("fill-opacity", OPACITY.stroke.unfocus);
    d3.select(el).classed("selected", true);
    d3.select("#" + datum.key + "-path").moveToFront().transition("select").duration(HOVER_TRANS_TIME).attr("fill-opacity", 0).attr("stroke-opacity", OPACITY.stroke.focus);
    d3.selectAll(".data-point").filter(function(d) { return datum.key == d.category; }).transition("select").duration(HOVER_TRANS_TIME).attr("fill-opacity", OPACITY.stroke.focus);
  }

  function xTween(startRadius, endRadius, startAngle, endAngle) {
    const interpolateRadius = d3.interpolate(startRadius, endRadius); const interpolateAngle = d3.interpolate(startAngle, endAngle);
    return function(t) { const interpolatedRadius = interpolateRadius(t); const interpolatedAngle = interpolateAngle(t); return interpolatedRadius * Math.sin(interpolatedAngle); };
  }

  function yTween(startRadius, endRadius, startAngle, endAngle) {
    const interpolateRadius = d3.interpolate(startRadius, endRadius); const interpolateAngle = d3.interpolate(startAngle, endAngle);
    return function(t) { const interpolatedRadius = interpolateRadius(t); const interpolatedAngle = interpolateAngle(t); return -interpolatedRadius * Math.cos(interpolatedAngle); };
  }
});
