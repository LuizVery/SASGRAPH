<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tabela D3.js Responsiva</title>
  <!-- Import D3.js -->
  <script src="https://d3js.org/d3.v5.min.js"></script>
</head>
<body>

<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: auto; /* Permite scroll se a tabela for muito grande */
  }

  #table-container {
    width: 100%;
    height: 100%;
    padding: 15px;
    box-sizing: border-box;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 8px;
    text-align: left;
    vertical-align: middle;
    border-bottom: 1px solid #ddd;
  }

  thead th {
    font-weight: bold;
    background-color: #f2f2f2;
    border-right: 1px solid #ccc;
    text-align: center;
    /* Adicionado para centralizar verticalmente o texto quebrado */
    vertical-align: middle; 
  }
  
  thead th:last-child {
    border-right: none;
  }

  /* Célula da primeira coluna (Ano) */
  td.year-cell {
      font-weight: bold;
      text-align: center;
      border-right: 1px solid #ddd;
  }
  
  td.data-cell {
      border-right: 1px solid #ddd;
  }
  td.data-cell:last-of-type {
       border-right: none;
  }

  .bar-container {
    position: relative;
    width: 100%;
    height: 20px;
    display: flex;
    align-items: center;
  }

  .bar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background-color: #3b82f6; /* Azul */
    border-radius: 2px;
  }

  .bar-text {
    position: relative; /* Para ficar acima da barra */
    padding-left: 5px;
    color: #333;
    font-weight: 500;
  }

</style>

<div id="table-container"></div>

<script>
"use strict";

// ** INÍCIO DA SEÇÃO DE DADOS DE EXEMPLO **
// Usado para testar o HTML fora do SAS VA.
const SAMPLE_MESSAGE = {
    version: "1", resultName: "d3Table", rowCount: 14,
    data: [
        [2010, "Federal", 0.98],
        [2010, "Estadual", 1.43],
        [2010, "Privada com fins", 0.41],
        [2010, "Privada sem fins", 0.35],
        [2011, "Federal", 0.69],
        [2011, "Estadual", 0.45],
        [2011, "Privada com fins", 0.55],
        [2011, "Privada sem fins", 0.41],
        [2012, "Federal", 1.00],
        [2012, "Estadual", 1.53],
        [2012, "Privada com fins", 0.58],
        [2012, "Privada sem fins", 0.74],
        [2013, "Federal", 0.63],
        [2013, "Estadual", 0.98],
        [2013, "Privada com fins", 0.73],
        [2013, "Privada sem fins", 0.71],
    ],
    columns: [
        { name: "year", label: "Ano", type: "number" },
        { name: "category", label: "Categoria", type: "string" },
        { name: "value", label: "Valor", type: "number", usage: "quantitative"}
    ]
};
// ** FIM DA SEÇÃO DE DADOS DE EXEMPLO **

let vaMessageReceived = false;

/*************************************************** Setup Callback Functions ***************************************************/
// Listener para receber dados do SAS Visual Analytics
window.addEventListener("message", onMessageReceived);

// Fallback para testar localmente com dados de exemplo
setTimeout(() => {
    if (!vaMessageReceived) {
        console.warn("Nenhuma mensagem do SAS VA foi recebida. Usando dados de exemplo.");
        onDataReceived(SAMPLE_MESSAGE);
    }
}, 500);

function onMessageReceived(event) {
    if (event && event.data && event.data.resultName) {
        vaMessageReceived = true;
        onDataReceived(event.data);
    }
}

// Função principal que processa os dados e desenha/atualiza a tabela
function onDataReceived(message) {
    if (!message || !message.data || message.data.length === 0) {
        d3.select("#table-container").html("<h1>Sem dados para exibir.</h1>");
        return;
    }

    // Identifica os índices das colunas pelos seus rótulos
    const yearIndex = message.columns.findIndex(c => c.label === "Ano");
    const categoryIndex = message.columns.findIndex(c => c.label === "Categoria");
    const valueIndex = message.columns.findIndex(c => c.label === "Valor");

    if (yearIndex === -1 || categoryIndex === -1 || valueIndex === -1) {
         d3.select("#table-container").html("<h1>Erro de configuração.</h1><p>Certifique-se de que as colunas 'Ano', 'Categoria' e 'Valor' estão atribuídas.</p>");
        return;
    }
    
    // Processa os dados brutos para um formato aninhado, ideal para a tabela
    const nestedData = d3.nest()
        .key(d => d[yearIndex])
        .object(message.data.map(d => ({
            year: d[yearIndex],
            category: d[categoryIndex],
            value: d[valueIndex]
        })));
    
    // Transforma o objeto aninhado num array de fácil utilização
    const tableData = Object.keys(nestedData).map(year => {
        const rowData = { year: year };
        nestedData[year].forEach(item => {
            rowData[item.category] = item.value;
        });
        return rowData;
    }).sort((a, b) => a.year - b.year); // Ordena por ano

    // Obtém uma lista única de todas as categorias para os cabeçalhos
    const categories = [...new Set(message.data.map(d => d[categoryIndex]))];
    
    drawTable(tableData, categories);
}


// Função para desenhar a tabela
function drawTable(data, categories) {
    // Limpa o conteúdo anterior
    d3.select("#table-container").html("");

    const table = d3.select("#table-container").append("table");
    const thead = table.append("thead");
    const tbody = table.append("tbody");

    // Cria os cabeçalhos da tabela
    const headers = ["Ano", ...categories];
    const headerRow = thead.append("tr")
        .selectAll("th")
        .data(headers)
        .enter()
        .append("th")
        .text(d => d)
        
    // A quebra de texto é chamada depois de um pequeno timeout
    // para garantir que a tabela e os estilos CSS foram renderizados,
    // permitindo uma medição de largura correta.
    setTimeout(() => {
        headerRow.each(function() {
            const th = d3.select(this);
            const availableWidth = this.getBoundingClientRect().width - 16; // Subtrai o padding (8px de cada lado)
            if (availableWidth > 0) {
                wrapText(th, availableWidth);
            }
        });
    }, 100);

    // Cria as linhas de dados da tabela
    const rows = tbody.selectAll("tr")
        .data(data)
        .enter()
        .append("tr");

    // Adiciona a célula do ano
    rows.append("td")
        .attr("class", "year-cell")
        .text(d => d.year);

    // Adiciona as células de dados com as barras
    categories.forEach(category => {
        rows.append("td")
            .attr("class", "data-cell")
            .each(function(d) {
                const cell = d3.select(this);
                const value = d[category];

                if (value !== undefined && value !== null) {
                    const container = cell.append("div").attr("class", "bar-container");
                    const barScale = d3.scaleLinear().domain([0, 1]).range([0, 100]).clamp(true);

                    container.append("div")
                        .attr("class", "bar")
                        .style("width", barScale(value) + "%");
                    
                    container.append("span")
                        .attr("class", "bar-text")
                        .text(d3.format(".0%")(value));
                }
            });
    });
}

// ** LÓGICA DE QUEBRA DE TEXTO CORRIGIDA PARA HTML **
// Cria um SVG oculto, uma única vez, para medir o texto de forma eficiente.
const measureSvg = d3.select("body").append("svg")
    .style("position", "absolute")
    .style("top", "-9999px")
    .style("left", "-9999px")
    .style("visibility", "hidden");
const measureText = measureSvg.append("text");

function wrapText(textElement, width) {
    const originalText = textElement.text();
    const words = originalText.split(/\s+/).reverse();
    
    if (words.length <= 1) return; // Não faz nada se houver uma ou nenhuma palavra

    let word;
    let line = [];
    let finalHtml = "";

    // Copia o estilo da fonte do elemento da tabela para o medidor SVG
    measureText.style("font", window.getComputedStyle(textElement.node()).font);

    while (word = words.pop()) {
        line.push(word);
        measureText.text(line.join(" "));
        // Se o texto medido no SVG for maior que a largura disponível
        if (measureText.node().getComputedTextLength() > width && line.length > 1) {
            line.pop();
            finalHtml += line.join(" ") + "<br>";
            line = [word];
        }
    }
    finalHtml += line.join(" ");

    // Atualiza o HTML da célula do cabeçalho com o texto quebrado
    textElement.html(finalHtml);
}

// Redesenha a tabela quando a janela é redimensionada para aplicar a quebra de texto
window.addEventListener('resize', () => {
    if (window.SAS_LAST_MESSAGE) {
        onDataReceived(window.SAS_LAST_MESSAGE);
    }
});

// Guarda a última mensagem para poder ser usada no redimensionamento
window.addEventListener("message", (event) => {
    if (event && event.data && event.data.resultName) {
        window.SAS_LAST_MESSAGE = event.data;
    }
});

</script>

</body>
</html>
