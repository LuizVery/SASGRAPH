<!DOCTYPE html>
<!--
    Autor: Adaptado para SAS Visual Analytics
    Versão: 4.0 - KPI Specific Matrix
    Descrição: Um objeto de conteúdo de dados para exibir um resumo de KPIs num formato de matriz específico.
               A lógica agrupa e calcula totais com base numa ordem predefinida de medidas.
               O layout utiliza CSS Grid para uma estrutura robusta e fiel ao design de referência.
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>KPI Specific Matrix para SAS VA</title>
    <!-- Import D3.js (usado para formatação de números) -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA (apenas se disponível) -->
    <script type="text/javascript">
        if (typeof window !== 'undefined' && window.self !== window.top) {
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis.");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    html, body, #card-container {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5;
        color: white;
    }

    #card-container {
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #1a7cb9, #0f679a);
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
    }

    /* Secção superior para KPIs gerais */
    .header-kpis {
        display: flex;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        flex-wrap: wrap;
        gap: 10px 20px;
    }
    .kpi-item {
        font-size: 1em;
        font-weight: 600;
    }

    /* Grelha principal para a matriz de dados */
    .data-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr; /* 3 colunas: Rótulo, Medida 1, Medida 2 */
        gap: 12px 10px; 
        padding-top: 10px;
        flex-grow: 1;
    }

    /* Estilos para as células da grelha */
    .grid-cell {
        font-size: 0.95em;
        display: flex;
        align-items: center;
    }
    .grid-header {
        font-weight: 700;
        opacity: 0.9;
        justify-content: center; /* Centraliza cabeçalhos */
    }
    .grid-label {
        font-weight: 600;
    }
    .grid-value {
        font-weight: 700;
        justify-content: flex-end; /* Alinha valores à direita */
    }
    
    /* Linha de total com destaque */
    .total-row > .grid-cell {
        font-weight: 700;
        border-top: 1px solid rgba(255, 255, 255, 0.5);
        padding-top: 8px;
        margin-top: 4px; 
    }
    
    .instructional-message {
        text-align: center;
        font-size: 1.1em;
        font-weight: 600;
        opacity: 0.9;
        padding: 20px;
        margin: auto;
    }

</style>

<div id="card-container">
    <!-- O conteúdo será gerado dinamicamente aqui -->
</div>

<script>
"use strict";

function initializeKPICard() {
    /*******************************************************
     * DECLARAÇÃO DE VARIÁVEIS                             *
     *******************************************************/
    const CONTAINER_ID = "card-container";
    let VA_RESULT_NAME;
    
    const ptBR = d3.formatLocale({
        decimal: ",",
        thousands: ".",
        grouping: [3],
        currency: ["R$", ""]
    });
    const formatNumber = ptBR.format(",.0f");

    /*******************************************************
     * DADOS DE EXEMPLO (PARA DEBUG)                       *
     *******************************************************/
    const SAMPLE_MESSAGE = {
        resultName: "kpiMatrixSample",
        data: [
            [194000957, 7399058254, 109837420, 7542043, 1870661, 1049604, 286833, 829107, 184048]
        ],
        columns: [
            { label: "População", type: "number" }, { label: "PIB", type: "number" }, { label: "PIB Per Capita", type: "number" },
            { label: "MAT_ENS_MEDIO", type: "number" }, { label: "CONC_ENS_MEDIO", type: "number" },
            { label: "MAT_EJA_ENS_MEDIO", type: "number" }, { label: "CONC_EJA", type: "number" },
            { label: "MAT_ED_PROF", type: "number" }, { label: "CONC_ED_PROFISSIONAL", type: "number" }
        ]
    };

    /*******************************************************
     * FUNÇÕES DE CALLBACK DO SAS VA                       *
     *******************************************************/
    if (typeof va !== 'undefined' && va.messagingUtil) {
        va.messagingUtil.setOnDataReceivedCallback(onDataReceived);
    } else {
        onDataReceived(SAMPLE_MESSAGE);
    }

    /**
     * Processa os dados recebidos do SAS VA e inicia a renderização.
     */
    function onDataReceived(messageFromVA) {
        VA_RESULT_NAME = messageFromVA.resultName;

        if (typeof va !== 'undefined' && va.contentUtil) {
            if (messageFromVA.columns.length < 9) {
                va.messagingUtil.postInstructionalMessage(VA_RESULT_NAME,
                    "Dados insuficientes. Atribua exatamente 9 medidas na ordem correta para construir a matriz."
                );
                return;
            }
        }

        if (!messageFromVA.data || messageFromVA.data.length === 0) {
            d3.select("#" + CONTAINER_ID).html("<p class='instructional-message'>Sem dados para exibir.</p>");
            return;
        }

        const dataRow = messageFromVA.data[0];
        
        // --- Processa os dados para o formato do nosso cartão ---
        const processedData = {
            headerKpis: [
                { label: "População", value: dataRow[0] },
                { label: "PIB", value: dataRow[1] },
                { label: "PIB per capita", value: dataRow[2] }
            ],
            tableData: {
                headers: ["Matrículas", "Concluintes"],
                rows: [
                    { label: "Ens.Médio Regular", values: [dataRow[3], dataRow[4]] },
                    { label: "EJA Ens. Médio", values: [dataRow[5], dataRow[6]] }
                ],
                // A linha de profissionalizante é separada e não entra no total
                footerRow: { label: "Profissionalizante", values: [dataRow[7], dataRow[8]] }
            }
        };

        // Calcula os totais com base nas linhas da tabela
        const totalMatriculas = d3.sum(processedData.tableData.rows, d => d.values[0]);
        const totalConcluintes = d3.sum(processedData.tableData.rows, d => d.values[1]);
        processedData.tableData.totalRow = { label: "TOTAL", values: [totalMatriculas, totalConcluintes] };
        
        renderCard(processedData);
    }

    /**
     * Renderiza ou atualiza o card no DOM.
     */
    function renderCard(data) {
        const container = d3.select("#" + CONTAINER_ID);
        container.html(""); // Limpa o conteúdo anterior

        // --- Renderiza o Cabeçalho ---
        const header = container.append("div").attr("class", "header-kpis");
        data.headerKpis.forEach(kpi => {
            header.append("div")
                  .attr("class", "kpi-item")
                  .text(`${kpi.label}: ${formatNumber(kpi.value)}`);
        });

        // --- Renderiza a Grelha de Dados ---
        const grid = container.append("div").attr("class", "data-grid");

        // Cabeçalho da grelha ("Matrículas", "Concluintes")
        grid.append("div"); // Célula vazia
        grid.append("div").attr("class", "grid-cell grid-header").text(data.tableData.headers[0]);
        grid.append("div").attr("class", "grid-cell grid-header").text(data.tableData.headers[1]);
        
        // Linhas de dados (Ens. Médio e EJA)
        data.tableData.rows.forEach(row => {
            grid.append("div").attr("class", "grid-cell grid-label").text(row.label);
            grid.append("div").attr("class", "grid-cell grid-value").text(formatNumber(row.values[0]));
            grid.append("div").attr("class", "grid-cell grid-value").text(formatNumber(row.values[1]));
        });
        
        // Linha de Total
        const totalRow = grid.append("div")
                             .attr("class", "total-row")
                             .style("grid-column", "1 / -1") // Faz a div da linha ocupar todo o espaço
                             .append("div")
                             .attr("class", "data-grid"); // Cria uma sub-grelha para alinhar

        totalRow.append("div").attr("class", "grid-cell grid-label").text(data.tableData.totalRow.label);
        totalRow.append("div").attr("class", "grid-cell grid-value").text(formatNumber(data.tableData.totalRow.values[0]));
        totalRow.append("div").attr("class", "grid-cell grid-value").text(formatNumber(data.tableData.totalRow.values[1]));
        
        // Linha de Rodapé (Profissionalizante)
        grid.append("div").attr("class", "grid-cell grid-label").text(data.tableData.footerRow.label);
        grid.append("div").attr("class", "grid-cell grid-value").text(formatNumber(data.tableData.footerRow.values[0]));
        grid.append("div").attr("class", "grid-cell grid-value").text(formatNumber(data.tableData.footerRow.values[1]));
    }
}

// Inicia a lógica do card
initializeKPICard();

</script>
</body>
</html>
