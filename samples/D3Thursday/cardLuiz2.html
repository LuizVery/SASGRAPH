<!DOCTYPE html>
<!--
    Autor: Adaptado para SAS Visual Analytics
    Versão: 3.2 - KPI List Card
    Descrição: Um objeto de conteúdo de dados para exibir uma lista de KPIs.
               Projetado para aceitar uma série de medidas, usando os nomes das medidas como rótulos.
               O layout utiliza Flexbox para um design limpo e responsivo.
    Melhoria: Adicionada mensagem de instrução se nenhum dado for recebido do SAS VA.
    Correção: Removida justificação de conteúdo após receber dados para garantir a renderização correta.
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>KPI List Card para SAS VA</title>
    <!-- Import D3.js (usado para formatação de números) -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA (apenas se disponível) -->
    <script type="text/javascript">
        if (typeof window !== 'undefined' && window.self !== window.top) {
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis.");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    html, body, #card-container {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-y: auto; /* Permite scroll se os itens não couberem */
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5;
        color: white;
    }

    #card-container {
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #1a7cb9, #0f679a);
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
    }
    
    .centered {
        justify-content: center; /* Centraliza a mensagem de instrução */
    }

    /* Estilo para cada linha de KPI */
    .kpi-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0; /* Impede que as linhas encolham */
    }
    
    /* Remove a borda do último item para um visual mais limpo */
    .kpi-row:last-child {
        border-bottom: none;
    }

    .kpi-label {
        font-size: 1em;
        font-weight: 600;
        opacity: 0.9;
        padding-right: 15px; /* Espaço entre o rótulo e o valor */
    }

    .kpi-value {
        font-size: 1.1em;
        font-weight: 700;
    }
    
    .instructional-message {
        text-align: center;
        font-size: 1.1em;
        font-weight: 600;
        opacity: 0.9;
        padding: 20px;
    }

</style>

<div id="card-container" class="centered">
    <!-- O conteúdo será gerado dinamicamente aqui -->
</div>

<script>
"use strict";

function initializeKPICard() {
    /*******************************************************
     * DECLARAÇÃO DE VARIÁVEIS                             *
     *******************************************************/
    const CONTAINER_ID = "card-container";
    let VA_RESULT_NAME;
    let dataReceived = false; // Flag para verificar se os dados chegaram
    
    // Define a formatação de números para o padrão brasileiro (ponto como separador de milhar)
    const ptBR = d3.formatLocale({
        decimal: ",",
        thousands: ".",
        grouping: [3],
        currency: ["R$", ""]
    });
    const formatNumber = ptBR.format(",.0f"); // Formato para inteiros com separador

    /*******************************************************
     * DADOS DE EXEMPLO (PARA DEBUG)                       *
     *******************************************************/
    const SAMPLE_MESSAGE = {
        resultName: "kpiListSample",
        data: [
            [194000957, 7399058254, 109837420, 7542043, 1870661, 1049604, 286833, 829107, 184048]
        ],
        columns: [
            { label: "População", type: "number" },
            { label: "PIB", type: "number" },
            { label: "PIB per capita", type: "number" },
            { label: "Matrículas Ens.Médio Regular", type: "number" },
            { label: "Concluintes Ens.Médio Regular", type: "number" },
            { label: "Matrículas EJA Ens. Médio", type: "number" },
            { label: "Concluintes EJA Ens. Médio", type: "number" },
            { label: "Matrículas Profissionalizante", type: "number" },
            { label: "Concluintes Profissionalizante", type: "number" }
        ]
    };

    /*******************************************************
     * FUNÇÕES DE CALLBACK DO SAS VA                       *
     *******************************************************/
    if (typeof va !== 'undefined' && va.messagingUtil) {
        va.messagingUtil.setOnDataReceivedCallback(message => {
            dataReceived = true; // Marca que os dados foram recebidos
            onDataReceived(message);
        });

        // Adiciona um timeout para verificar se os dados chegaram.
        // Se não, exibe uma mensagem para o utilizador.
        setTimeout(() => {
            if (!dataReceived) {
                const container = d3.select("#" + CONTAINER_ID);
                container.html("") // Limpa qualquer conteúdo
                         .classed("centered", true) // Garante que a mensagem esteja centrada
                         .append("div")
                         .attr("class", "instructional-message")
                         .html("Para começar, por favor atribua uma ou mais medidas às Funções de Dados.");
            }
        }, 1500);

    } else {
        // Se estiver fora do VA, usa os dados de exemplo imediatamente
        onDataReceived(SAMPLE_MESSAGE);
    }

    /**
     * Processa os dados recebidos do SAS VA e inicia a renderização.
     */
    function onDataReceived(messageFromVA) {
        VA_RESULT_NAME = messageFromVA.resultName;

        if (!messageFromVA.data || messageFromVA.data.length === 0 || messageFromVA.columns.length === 0) {
            d3.select("#" + CONTAINER_ID)
              .html("<p class='instructional-message'>Por favor, atribua uma ou mais medidas.</p>")
              .classed("centered", true);
            return;
        }

        const columnLabels = messageFromVA.columns.map(c => c.label);
        const firstRowValues = messageFromVA.data[0];
        
        const kpiList = columnLabels.map((label, index) => {
            return {
                label: label,
                value: firstRowValues[index]
            };
        });
        
        // Log para depuração, visível na consola do navegador (F12)
        console.log("Dados processados para renderização:", kpiList);
        
        renderCard(kpiList);
    }

    /**
     * Renderiza ou atualiza o card no DOM.
     * @param {Array} kpiList - Uma lista de objetos {label, value}.
     */
    function renderCard(kpiList) {
        const container = d3.select("#" + CONTAINER_ID);
        container.html(""); // Limpa o conteúdo anterior

        // CORREÇÃO: Remove a classe de centralização para alinhar a lista ao topo
        container.classed("centered", false);

        // Itera sobre a lista de KPIs e cria uma linha para cada um
        kpiList.forEach(kpi => {
            const kpiRow = container.append("div").attr("class", "kpi-row");
            
            kpiRow.append("span")
                  .attr("class", "kpi-label")
                  .text(kpi.label);

            kpiRow.append("span")
                  .attr("class", "kpi-value")
                  .text(formatNumber(kpi.value));
        });
    }
}

// Inicia a lógica do card
initializeKPICard();

</script>
</body>
</html>
