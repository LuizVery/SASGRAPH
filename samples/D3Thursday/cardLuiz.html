<!DOCTYPE html>
<!--
Adaptado para SAS Visual Analytics.
Estrutura baseada no exemplo D3 Radar Chart fornecido pela SAS.
Lógica do card KPI e design fornecidos pelo usuário.
VERSÃO ADAPTADA: Trabalha com múltiplas linhas ao invés de arrays
MODIFICAÇÃO: Layout horizontal - gráfico alargado, variações compactas
ATUALIZAÇÃO: Formatação correta dos valores (máximo 3 dígitos, sem .0 desnecessário)
MELHORIAS: Layout responsivo horizontal, fonte Avenir Next, valores destacados
MODIFICAÇÃO FINAL: Adicionada dica de dados (tooltip) com formatação completa (separador de milhar).
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>KPI Card Responsive Proper Formatting para SAS VA</title>
    <!-- Import D3.js -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA (apenas se disponível) -->
    <script type="text/javascript">
        // Verifica se os utilitários do SAS VA estão disponíveis antes de importar
        if (typeof window !== 'undefined' && window.self !== window.top) {
            // Está em iframe, pode tentar carregar os utilitários do SAS
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    /* Estilos globais para garantir que o SVG preencha o espaço */
    html, body, svg {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Evita barras de rolagem indesejadas */
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5; /* Cor de fundo para modo de depuração */
    }

    /* Estilos para os textos dentro do card - COM MAIS DESTAQUE */
    .title-text {
        fill: #f1f1f1f1;
        font-weight: 700;
        text-anchor: middle;
        text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    .main-label-text {
        fill: #f1f1f1f1;
        font-weight: 600;
    }

    .main-value-text {
        fill: #f1f1f1f1;
        font-weight: 700;
        text-shadow: 0px 2px 4px rgba(0,0,0,0.15);
    }

    .secondary-label-text {
        fill: #f1f1f1f1;
        font-weight: 600;
        text-anchor: middle;
    }

    .secondary-value-text {
        fill: #f1f1f1f1;
        font-weight: 700;
        text-anchor: middle;
        text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    /* Estilo para a Dica de Dados (Tooltip) */
    .tooltip {
        position: absolute;
        text-align: center;
        padding: 6px;
        font: 11px 'Avenir Next', sans-serif;
        background: rgba(0,0,0,0.8);
        color: white;
        border: 0;
        border-radius: 5px;
        pointer-events: none; /* Impede que o tooltip intercepte eventos do mouse */
        transition: opacity 0.2s;
    }
</style>

<div id="chart-container"></div>
<!-- O elemento da dica de dados será adicionado aqui -->

<script>
"use strict";

// Função para aguardar o carregamento do D3
function waitForD3(callback) {
    if (typeof d3 !== 'undefined') {
        callback();
    } else {
        setTimeout(function() {
            waitForD3(callback);
        }, 100);
    }
}

// Aguarda tanto o DOM quanto o D3 estarem prontos
document.addEventListener("DOMContentLoaded", function() {
    waitForD3(function() {
        initializeKPICard();
    });
});

function initializeKPICard() {
    /*******************************************************
     * DECLARAÇÃO DE VARIÁVEIS                            *
     *******************************************************/

    // Constantes e configurações
    const SVG_CONTAINER_ID = "chart-container"; // ID do container do gráfico
    let VA_RESULT_NAME; // Nome do resultado para comunicação com o VA

    // Dados dinâmicos
    let vaMessage; // Mensagem de dados recebida do VA
    let processedData; // Dados processados e prontos para uso
    let lastRenderTime = 0; // Para debouncing de atualizações
    const renderDelay = 250; // Atraso para evitar renderizações excessivas

    // Elementos D3
    let svg, mainGroup;

    // Adiciona o elemento tooltip ao corpo do documento
    const tooltip = d3.select("body").append("div")
        .attr("class", "tooltip")
        .style("opacity", 0);

    // NOVO: Define o locale para formatação de número em pt-BR
    const ptBR = d3.formatLocale({
        decimal: ",",
        thousands: ".",
        grouping: [3],
        currency: ["R$", " "]
    });

    // NOVO: Formatter para a dica de dados com separador de milhar
    const formatTooltipValue = ptBR.format(",.0f");

    /*******************************************************
     * FUNÇÃO DE FORMATAÇÃO PERSONALIZADA (ABREVIADA)     *
     *******************************************************/
    
    /**
     * Formata valores com máximo 3 dígitos e sem .0 desnecessário
     * @param {number} value - Valor a ser formatado
     * @returns {string} - Valor formatado
     */
    function formatValue(value) {
        if (value >= 1000000000) {
            // Para bilhões
            const billions = value / 1000000000;
            if (billions >= 100) {
                return Math.round(billions) + "B";
            } else if (billions >= 10) {
                return d3.format(".1f")(billions).replace(/\.0$/, "") + "B";
            } else {
                return d3.format(".2f")(billions).replace(/\.00$/, "").replace(/0$/, "") + "B";
            }
        } else if (value >= 1000000) {
            // Para milhões
            const millions = value / 1000000;
            if (millions >= 100) {
                return Math.round(millions) + "Mi";
            } else if (millions >= 10) {
                return d3.format(".1f")(millions).replace(/\.0$/, "") + "Mi";
            } else {
                return d3.format(".2f")(millions).replace(/\.00$/, "").replace(/0$/, "") + "Mi";
            }
        } else if (value >= 1000) {
            // Para milhares
            const thousands = value / 1000;
            if (thousands >= 100) {
                return Math.round(thousands) + "Mil";
            } else if (thousands >= 10) {
                return d3.format(".1f")(thousands).replace(/\.0$/, "") + "Mil";
            } else {
                return d3.format(".2f")(thousands).replace(/\.00$/, "").replace(/0$/, "") + "Mil";
            }
        } else {
            // Para valores menores que 1000
            if (value === Math.floor(value)) {
                return Math.round(value).toString();
            } else {
                return d3.format(".1f")(value).replace(/\.0$/, "");
            }
        }
    }

    /*******************************************************
     * CONFIGURAÇÃO PARA DEBUG FORA DO SAS VA             *
     *******************************************************/
    const SAMPLE_MESSAGE = {
        resultName: "kpiCardSample",
        rowCount: 6,
        data: [
            ["Vendas Anuais", 2019, 1250000],
            ["Vendas Anuais", 2020, 1380000],
            ["Vendas Anuais", 2021, 1420000],
            ["Vendas Anuais", 2022, 1650000],
            ["Vendas Anuais", 2023, 1850000],
            ["Vendas Anuais", 2024, 1920000]
        ],
        columns: [
            { label: "Título", type: "string" },
            { label: "Ano", type: "number" },
            { label: "Valor Temporal", type: "number", format: { name: "BEST", precision: 0 } }
        ]
    };

    /*******************************************************
     * FUNÇÕES DE CALLBACK DO SAS VA                      *
     *******************************************************/

    if (isInSASVA()) {
        if (typeof va !== 'undefined' && va.messagingUtil) {
            va.messagingUtil.setOnDataReceivedCallback(handleDataReceived);
        }
        if (typeof va !== 'undefined' && va.contentUtil) {
            va.contentUtil.setupResizeListener(renderCard);
        }
    } else {
        handleDataReceived(SAMPLE_MESSAGE);
        window.addEventListener("resize", renderCard);
    }

    function isInSASVA() {
        try {
            return window.self !== window.top && typeof va !== 'undefined' && va.messagingUtil && va.contentUtil;
        } catch (e) {
            return false;
        }
    }

    function handleDataReceived(messageFromVA) {
        const now = Date.now();
        if (now - lastRenderTime < renderDelay) {
            setTimeout(() => onDataReceived(messageFromVA), renderDelay);
        } else {
            onDataReceived(messageFromVA);
        }
        lastRenderTime = now;
    }

    function onDataReceived(messageFromVA) {
        vaMessage = messageFromVA;
        VA_RESULT_NAME = messageFromVA.resultName;

        if (isInSASVA() && typeof va !== 'undefined' && va.contentUtil) {
            const expectedRoles = ["string", "number", "number"];
            if (!va.contentUtil.validateRoles(messageFromVA, expectedRoles, false)) {
                if (va.messagingUtil) {
                    va.messagingUtil.postInstructionalMessage(VA_RESULT_NAME, "As colunas devem ser: Título (string), Período (número), Valor Temporal (número).");
                }
                return;
            }
        }

        if (!messageFromVA.data || messageFromVA.data.length === 0) {
            processedData = null;
            d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();
            return;
        }

        const columns = messageFromVA.columns;
        const allData = messageFromVA.data;
        
        const timeSeriesData = [];
        let titulo = "";
        
        allData.forEach((row, index) => {
            if (index === 0) titulo = row[0];
            timeSeriesData.push({ periodo: row[1], valor: row[2] });
        });
        
        timeSeriesData.sort((a, b) => a.periodo - b.periodo);
        
        const valores = timeSeriesData.map(d => d.valor);
        const ultimoValor = valores[valores.length - 1];
        const primeiroValor = valores[0];
        const penultimoValor = valores.length > 1 ? valores[valores.length - 2] : null;
        
        let variacaoPeriodo = 0;
        if (primeiroValor !== 0 && primeiroValor !== null && ultimoValor !== null) {
            variacaoPeriodo = ((ultimoValor - primeiroValor) / primeiroValor) * 100;
        }
        
        let variacaoAnterior = 0;
        if (penultimoValor !== null && penultimoValor !== 0 && ultimoValor !== null) {
            variacaoAnterior = ((ultimoValor - penultimoValor) / penultimoValor) * 100;
        }

        let mediaAnual = 0;
        if (timeSeriesData.length > 1) {
            const primeiroAno = timeSeriesData[0].periodo;
            const ultimoAno = timeSeriesData[timeSeriesData.length - 1].periodo;
            const anosDecorridos = ultimoAno - primeiroAno;
            if (anosDecorridos > 0 && primeiroValor !== 0 && primeiroValor !== null) {
                mediaAnual = (Math.pow(ultimoValor / primeiroValor, 1 / anosDecorridos) - 1) * 100;
            }
        }
        
        processedData = {
            titulo: titulo,
            valorPrincipal: { label: "Variação no Período", value: variacaoPeriodo, format: val => val !== null ? d3.format("+.1f")(val) + "%" : "N/A" },
            valorSecundario: { label: "Variação vs Ano Anterior", value: variacaoAnterior, format: val => val !== null ? d3.format("+.1f")(val) + "%" : "N/A" },
            valorTerciario: { label: "Média Anual (CAGR)", value: mediaAnual, format: val => val !== null ? d3.format("+.1f")(val) + "%" : "N/A" },
            serieTemporal: { dados: timeSeriesData, valores: valores, periodos: timeSeriesData.map(d => d.periodo.toString()), label: columns[2].label }
        };

        renderCard();
    }

    /*******************************************************
     * FUNÇÃO PRINCIPAL DE RENDERIZAÇÃO                   *
     *******************************************************/

    function renderCard() {
        if (!processedData) return;

        const width = document.body.clientWidth;
        const height = document.body.clientHeight;
        const isCompactHorizontal = (width / height) > 2.5;
        
        d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();

        svg = d3.select("#" + SVG_CONTAINER_ID).append("svg").attr("width", width).attr("height", height);

        const defs = svg.append("defs");
        const gradient = defs.append("linearGradient").attr("id", "cardGradient").attr("x1", "0%").attr("y1", "0%").attr("x2", "100%").attr("y2", "100%");
        gradient.append("stop").attr("offset", "0%").attr("stop-color", "#2F77AE");
        gradient.append("stop").attr("offset", "100%").attr("stop-color", "#126DA3");

        svg.append("rect").attr("width", width).attr("height", height).attr("rx", 8).attr("fill", "url(#cardGradient)").attr("stroke", "#d0d0d0").attr("stroke-width", 1);

        mainGroup = svg.append("g");
        
        const padding = Math.max(width * 0.015, 8);
        const contentWidth = width - (padding * 2);
        
        let titleFontSize, labelFontSize, valueFontSize, titleHeight;
        
        if (isCompactHorizontal) {
            titleFontSize = Math.min(Math.max(height * 0.1, 12), 16);
            labelFontSize = Math.min(Math.max(height * 0.12, 10), 16);
            valueFontSize = Math.min(Math.max(height * 0.16, 12), 20);
            titleHeight = Math.max(height * 0.18, 25);
        } else {
            titleFontSize = Math.min(Math.max(height * 0.07, 16), width * 0.045, 24);
            labelFontSize = Math.min(Math.max(height * 0.07, 16), width * 0.04, 24);
            valueFontSize = Math.min(Math.max(height * 0.09, 20), width * 0.05, 30);
            titleHeight = Math.max(height * 0.12, 45);
        }

        const contentSectionHeight = height - titleHeight - padding;
        
        let chartWidthRatio = isCompactHorizontal ? 0.72 : 0.75;
        const chartWidth = Math.max(contentWidth * chartWidthRatio, 180);
        const variationsWidth = contentWidth - chartWidth - padding;

        mainGroup.append("text").attr("class", "title-text").attr("x", width / 2).attr("y", padding + titleFontSize * 0.8).attr("font-size", titleFontSize + "px").text(processedData.titulo);

        const chartY = titleHeight;
        const chartHeight = Math.max(contentSectionHeight * 0.85, 80);
        
        const chartGroup = mainGroup.append("g").attr("transform", "translate(" + padding + ", " + chartY + ")");
        
        const valores = processedData.serieTemporal.valores;
        const periodos = processedData.serieTemporal.periodos;
        
        if (valores.length > 0) {
            const minVal = d3.min(valores);
            const maxVal = d3.max(valores);
            const range = maxVal - minVal || 1;
            
            const innerChartPadding = Math.max(chartWidth * 0.04, 10);
            const innerWidth = chartWidth - (innerChartPadding * 2);
            const innerHeight = chartHeight - (innerChartPadding * 2);
            
            const lineData = valores.map((valor, i) => {
                const x = innerChartPadding + (innerWidth / Math.max(valores.length - 1, 1)) * i;
                const normalizedY = range > 0 ? (valor - minVal) / range : 0.5;
                const y = innerChartPadding + innerHeight * (1 - normalizedY);
                return { x, y, value: valor, period: periodos[i] || ("P" + (i + 1)) };
            });
            
            const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveMonotoneX);
            const strokeWidth = isCompactHorizontal ? Math.min(Math.max(height * 0.02, 2), 5) : Math.min(Math.max(width * 0.008, 3), 8);
            
            chartGroup.append("path").datum(lineData).attr("d", line).attr("stroke", "#36EBD6").attr("stroke-width", strokeWidth).attr("fill", "none").attr("stroke-linecap", "round");
            
            const pointRadius = isCompactHorizontal ? Math.min(Math.max(height * 0.015, 2), 4) : Math.min(Math.max(width * 0.005, 3), 7);
            
            chartGroup.selectAll(".data-point")
                .data(lineData)
                .enter()
                .append("circle")
                .attr("class", "data-point")
                .attr("cx", d => d.x)
                .attr("cy", d => d.y)
                .attr("r", pointRadius)
                .attr("fill", "#36EBD6")
                .attr("stroke", "#ffffff")
                .attr("stroke-width", Math.max(pointRadius * 0.3, 1))
                .on("mouseover", (event, d) => {
                    tooltip.transition().duration(200).style("opacity", .9);
                    // ATUALIZADO: Usa o novo formatador para o valor
                    tooltip.html(`<strong>${d.period}</strong><br/>${formatTooltipValue(d.value)}`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", () => {
                    tooltip.transition().duration(500).style("opacity", 0);
                });
            
            const yearLabelFontSize = isCompactHorizontal ? Math.min(Math.max(height * 0.08, 7), 12) : Math.min(Math.max(height * 0.04, 10), width * 0.025, 15);
            
            chartGroup.selectAll(".year-label")
                .data(lineData)
                .enter()
                .append("text")
                .attr("class", "year-label")
                .attr("x", d => d.x)
                .attr("y", chartHeight + Math.max(12, height * 0.02))
                .attr("font-size", yearLabelFontSize + "px")
                .attr("fill", "#f1f1f1")
                .attr("text-anchor", "middle")
                .attr("font-weight", "600")
                .text(d => d.period);
            
        } else {
            chartGroup.append("text").attr("x", chartWidth / 2).attr("y", chartHeight / 2).attr("font-size", Math.min(Math.max(10, height * 0.02), width * 0.025) + "px").attr("fill", "rgba(45,80,22,0.5)").attr("text-anchor", "middle").text("Sem dados temporais");
        }

        const separatorX = padding + chartWidth + (padding / 2);
        mainGroup.append("line").attr("x1", separatorX).attr("y1", chartY).attr("x2", separatorX).attr("y2", chartY + contentSectionHeight).attr("stroke", "rgba(241,241,241,0.3)").attr("stroke-width", 1);

        const variationsX = separatorX + (padding / 2);
        const variationsGroup = mainGroup.append("g").attr("transform", `translate(${variationsX}, ${chartY})`);
        
        const availableVariationsHeight = contentSectionHeight * 0.9;
        const variationBlockHeight = availableVariationsHeight / 3;
        const variationStartY = contentSectionHeight * 0.05;
        const labelValueSpacing = isCompactHorizontal ? Math.max(variationBlockHeight * 0.45, 12) : Math.max(variationBlockHeight * 0.35, 20);
        const variationCenterX = variationsWidth / 2;
        
        const kpis = [processedData.valorPrincipal, processedData.valorSecundario, processedData.valorTerciario];
        kpis.forEach((kpi, i) => {
            const yPos = variationStartY + (i * variationBlockHeight);
            variationsGroup.append("text").attr("class", "secondary-label-text").attr("x", variationCenterX).attr("y", yPos).attr("font-size", labelFontSize + "px").text(kpi.label);
            variationsGroup.append("text").attr("class", "secondary-value-text").attr("x", variationCenterX).attr("y", yPos + labelValueSpacing).attr("font-size", valueFontSize + "px").text(kpi.format(kpi.value));
        });
    }
}
</script>
</body>
</html>
