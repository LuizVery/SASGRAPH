<!DOCTYPE html>
<!--
Adaptado para SAS Visual Analytics.
Gráfico de barras horizontal com cores dinâmicas usando uma escala de quantis,
que se adapta aos filtros e distribui as cores de forma equilibrada.
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>Gráfico de Barras Horizontal para SAS VA</title>
    <!-- Import D3.js -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA -->
    <script type="text/javascript">
        if (typeof window !== 'undefined' && window.self !== window.top) {
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: transparent;
    }

    #chart-container {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
    }

    svg {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: transparent;
    }

    .data-bar {
        stroke: #cccccc;
        stroke-width: 0.5px;
    }

    .data-bar:hover {
        opacity: 0.8;
        cursor: pointer;
    }

    .y-axis text {
        font-family: 'Avenir Next', sans-serif;
        font-size: 13px;
        font-weight: normal;
        fill: black;
    }

    .y-axis .tick line, .y-axis path {
        display: none;
    }

    .value-label {
        font-family: 'Avenir Next', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #333;
    }

    .tooltip {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 8px 13px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        font-family: 'Avenir Next', sans-serif;
        pointer-events: none;
        z-index: 1000;
        display: none;
    }
</style>

<div id="chart-container"></div>
<div id="tooltip" class="tooltip"></div>

<script>
"use strict";

function waitForD3(callback) {
    if (typeof d3 !== 'undefined') {
        callback();
    } else {
        setTimeout(() => waitForD3(callback), 100);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    waitForD3(initializeBarChart);
});

function initializeBarChart() {
    const SVG_CONTAINER_ID = "chart-container";
    let VA_RESULT_NAME;
    let vaMessage;
    let processedData;
    let lastRenderTime = 0;
    const renderDelay = 250;
    let svg, mainGroup;
    const tooltip = d3.select("#tooltip");

    const SAMPLE_MESSAGE = {
        resultName: "barChartSample",
        rowCount: 12,
        data: [
            ["Macapá", 34.64], ["Santana", 9.96], ["Mazagão", 9.37], ["Laranjal do Jari", 8.42],
            ["Oiapoque", 6.05], ["Tartarugalzinho", 5.34], ["Vitória do Jari", 3.91], ["Porto Grande", 3.80],
            ["Itaubal", 3.44], ["Pedra Branca do Amapari", 3.20], ["Amapá", 2.85], ["Calçoene", 2.73]
        ],
        columns: [
            { label: "Município", type: "string" },
            { label: "Percentual de escolas ano atual", type: "number", format: { name: "BEST", precision: 2 } }
        ]
    };

    // **[MUDANÇA]** A função getBarColor foi removida.
    // Usaremos uma escala D3 (colorScale) criada dinamicamente.

    function formatPercentage(value) {
        return d3.format(".2f")(value) + "%";
    }

    function showTooltip(event, data) {
        const categoryLabel = processedData.columnLabels.category || "Categoria";
        const valueLabel = processedData.columnLabels.value || "Valor";
        const formattedValue = formatPercentage(data.value);
        
        const tooltipContent = `${categoryLabel}: ${data.category}<br/>${valueLabel}: ${formattedValue}`;
        
        tooltip.style("display", "block")
            .html(tooltipContent)
            .style("left", `${event.pageX + 10}px`)
            .style("top", `${event.pageY - 10}px`);
    }

    function hideTooltip() {
        tooltip.style("display", "none");
    }

    if (isInSASVA()) {
        if (typeof va !== 'undefined' && va.messagingUtil) {
            va.messagingUtil.setOnDataReceivedCallback(handleDataReceived);
        }
        if (typeof va !== 'undefined' && va.contentUtil) {
            va.contentUtil.setupResizeListener(renderChart);
        }
    } else {
        handleDataReceived(SAMPLE_MESSAGE);
        window.addEventListener("resize", renderChart);
    }

    function isInSASVA() {
        try {
            return window.self !== window.top && typeof va !== 'undefined' && va.messagingUtil && va.contentUtil;
        } catch (e) {
            return false;
        }
    }

    function handleDataReceived(messageFromVA) {
        const now = Date.now();
        if (now - lastRenderTime < renderDelay) {
            setTimeout(() => onDataReceived(messageFromVA), renderDelay);
        } else {
            onDataReceived(messageFromVA);
        }
        lastRenderTime = now;
    }

    function onDataReceived(messageFromVA) {
        vaMessage = messageFromVA;
        VA_RESULT_NAME = messageFromVA.resultName;

        if (!messageFromVA.data || messageFromVA.data.length === 0) {
            processedData = null;
            d3.select(`#${SVG_CONTAINER_ID}`).selectAll("*").remove();
            return;
        }

        const columns = messageFromVA.columns;
        const allData = messageFromVA.data;
        
        const chartData = allData
            .map(row => ({ category: row[0], value: parseFloat(row[1]) || 0 }))
            .sort((a, b) => b.value - a.value);

        // **[NOVA ABORDAGEM DINÂMICA]**
        // Cria uma escala de quantis. Esta escala agrupa os dados em N grupos
        // (quantis) com aproximadamente o mesmo número de pontos de dados,
        // tornando-a robusta a valores extremos e ideal para filtros.
        const colorRange = [
            "#DE432A", "#E8773D", "#EE9E4A", "#F0A84D", "#F7D15B",
            "#F5C958", "#F8D95E", "#D9EC6B", "#C1E16C", "#CEE76C",
            "#ACDD6D", "#99CD6D", "#63B46E", "#4EA96F", "#329C70"
        ];

        // O domínio da escala são todos os valores de dados atuais.
        // O range é a nossa paleta de cores. D3 faz a mágica.
        const colorScale = d3.scaleQuantile()
            .domain(chartData.map(d => d.value))
            .range(colorRange);

        processedData = {
            data: chartData,
            colorScale: colorScale, // Armazena a escala para ser usada na renderização
            columnLabels: {
                category: columns[0].label,
                value: columns[1].label
            }
        };

        console.log("Dados processados com escala de quantis dinâmica.");
        renderChart();
    }

    function renderChart() {
        if (!processedData) return;

        const containerWidth = document.body.clientWidth;
        const containerHeight = document.body.clientHeight;
        
        const barHeight = 25;
        const totalBars = processedData.data.length;
        const calculatedHeight = Math.max(containerHeight, totalBars * barHeight + 40);

        d3.select(`#${SVG_CONTAINER_ID}`).selectAll("*").remove();

        const margin = { top: 10, right: 80, bottom: 10, left: 120 };
        const chartWidth = containerWidth - margin.left - margin.right;
        const chartHeight = calculatedHeight - margin.top - margin.bottom;

        svg = d3.select(`#${SVG_CONTAINER_ID}`)
            .append("svg")
            .attr("width", containerWidth)
            .attr("height", calculatedHeight);

        mainGroup = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const xScale = d3.scaleLinear()
            .domain([0, d3.max(processedData.data, d => d.value)])
            .range([0, chartWidth]);

        const yScale = d3.scaleBand()
            .domain(processedData.data.map(d => d.category))
            .range([0, chartHeight])
            .padding(0.4);

        mainGroup.append("g").attr("class", "y-axis axis").call(d3.axisLeft(yScale));

        mainGroup.selectAll(".data-bar")
            .data(processedData.data)
            .enter()
            .append("rect")
            .attr("class", "data-bar")
            .attr("x", 0)
            .attr("y", d => yScale(d.category))
            .attr("width", d => xScale(d.value))
            .attr("height", yScale.bandwidth())
            // **[MUDANÇA]** A cor agora é definida pela escala de quantis dinâmica.
            .attr("fill", d => processedData.colorScale(d.value))
            .on("mouseenter", showTooltip)
            .on("mouseleave", hideTooltip)
            .on("mousemove", showTooltip);

        mainGroup.selectAll(".value-label")
            .data(processedData.data)
            .enter()
            .append("text")
            .attr("class", "value-label")
            .attr("x", d => xScale(d.value) + 8)
            .attr("y", d => yScale(d.category) + yScale.bandwidth() / 2)
            .attr("dy", "0.35em")
            .text(d => formatPercentage(d.value));
    }
}
</script>
</body>
</html>
