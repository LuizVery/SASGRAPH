<!DOCTYPE html>
<!--
Adaptado para SAS Visual Analytics baseado EXATAMENTE no código KPI Card funcional.
Gráfico de barras horizontal com cores dinâmicas e limite de 15 itens.
VERSÃO MODIFICADA: Fundo transparente, margens zeradas e fonte aumentada
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>Gráfico de Barras Horizontal para SAS VA</title>
    <!-- Import D3.js -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA (EXATA ESTRUTURA DO KPI) -->
    <script type="text/javascript">
        if (typeof window !== 'undefined' && window.self !== window.top) {
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: transparent; /* FUNDO TRANSPARENTE */
    }

    #chart-container {
        width: 100%;
        height: 100%;
        overflow-y: auto; /* HABILITA ROLAGEM VERTICAL */
        overflow-x: hidden;
    }

    svg {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: transparent;
    }

    .data-bar {
        stroke: none;
    }

    .data-bar:hover {
        opacity: 0.8;
        cursor: pointer;
    }

    .y-axis text {
        font-family: 'Avenir Next', sans-serif;
        font-size: 14px; /* FONTE AUMENTADA */
        font-weight: normal;
        fill: black;
    }

    /* REMOVENDO OS TICKS (tracinhos) DO EIXO Y */
    .y-axis .tick line {
        display: none; /* Remove os tracinhos */
    }

    .y-axis path {
        display: none; /* Remove a linha principal do eixo */
    }

    .value-label {
        font-family: 'Avenir Next', sans-serif;
        font-size: 14px; /* FONTE AUMENTADA */
        font-weight: 600;
        fill: #333;
    }

    .tooltip {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 14px; /* FONTE AUMENTADA */
        font-weight: 500;
        font-family: 'Avenir Next', sans-serif;
        pointer-events: none;
        z-index: 1000;
        display: none;
    }
</style>

<div id="chart-container"></div>
<div id="tooltip" class="tooltip"></div>

<script>
"use strict";

function waitForD3(callback) {
    if (typeof d3 !== 'undefined') {
        callback();
    } else {
        setTimeout(function() { 
            waitForD3(callback); 
        }, 100);
    }
}

document.addEventListener("DOMContentLoaded", function() {
    waitForD3(function() {
        initializeBarChart();
    });
});

function initializeBarChart() {
    // ESTRUTURA EXATA DO KPI CARD
    const SVG_CONTAINER_ID = "chart-container";
    let VA_RESULT_NAME;
    let vaMessage;
    let processedData;
    let lastRenderTime = 0;
    const renderDelay = 250;
    let svg, mainGroup;
    const tooltip = d3.select("#tooltip");

    // DADOS DE EXEMPLO EXATOS (com valores em formato decimal para porcentagem)
    const SAMPLE_MESSAGE = {
        resultName: "barChartSample",
        rowCount: 15,
        data: [
            ["Teresina", 11.49],
            ["Macapá", 5.66],
            ["Parnaíba", 2.62],
            ["Picos", 1.75],
            ["Floriano", 1.55],
            ["Santana", 1.51],
            ["Piripiri", 1.45],
            ["Mazagão", 1.43],
            ["União", 1.41],
            ["São Paulo", 8.52],
            ["Rio de Janeiro", 7.85],
            ["Belo Horizonte", 7.23],
            ["Salvador", 6.87],
            ["Fortaleza", 6.51]
        ],
        columns: [
            { label: "Município", type: "string" },
            { label: "Porcentagem de frequência", type: "number", format: { name: "BEST", precision: 2 } }
        ]
    };

    // FUNÇÕES DE CORES (IGUAIS ÀS SUAS ESPECIFICAÇÕES)
    function calculateDynamicLimits(data) {
        const values = data.map(d => d.value);
        const minValue = d3.min(values);
        const maxValue = d3.max(values);
        const range = maxValue - minValue;
        
        const limits = {};
        for (let i = 1; i <= 14; i++) {
            limits[`C_LIMITE_${i.toString().padStart(2, '0')}`] = minValue + (range * i / 15);
        }
        
        return limits;
    }

    function getBarColor(value, limits) {
        if (value <= limits.C_LIMITE_01) return "#DE432A";
        else if (value > limits.C_LIMITE_01 && value <= limits.C_LIMITE_02) return "#E8773D";
        else if (value > limits.C_LIMITE_02 && value <= limits.C_LIMITE_03) return "#EE9E4A";
        else if (value > limits.C_LIMITE_03 && value <= limits.C_LIMITE_04) return "#F0A84D";
        else if (value > limits.C_LIMITE_04 && value <= limits.C_LIMITE_05) return "#F7D15B";
        else if (value > limits.C_LIMITE_05 && value <= limits.C_LIMITE_06) return "#F5C958";
        else if (value > limits.C_LIMITE_06 && value <= limits.C_LIMITE_07) return "#F8D95E";
        else if (value > limits.C_LIMITE_07 && value <= limits.C_LIMITE_08) return "#D9EC6B";
        else if (value > limits.C_LIMITE_08 && value <= limits.C_LIMITE_09) return "#C1E16C";
        else if (value > limits.C_LIMITE_09 && value <= limits.C_LIMITE_10) return "#CEE76C";
        else if (value > limits.C_LIMITE_10 && value <= limits.C_LIMITE_11) return "#ACDD6D";
        else if (value > limits.C_LIMITE_11 && value <= limits.C_LIMITE_12) return "#99CD6D";
        else if (value > limits.C_LIMITE_12 && value <= limits.C_LIMITE_13) return "#63B46E";
        else if (value > limits.C_LIMITE_13 && value <= limits.C_LIMITE_14) return "#4EA96F";
        else return "#329C70";
    }

    // FUNÇÃO PARA FORMATAR PORCENTAGEM (igual à imagem)
    function formatPercentage(value) {
        return d3.format(".2f")(value) + "%";
    }

    // TOOLTIP
    function showTooltip(event, data) {
        const categoryLabel = processedData.columnLabels.category || "Categoria";
        const valueLabel = processedData.columnLabels.value || "Valor";
        const formattedValue = formatPercentage(data.value);
        
        const tooltipContent = `${categoryLabel}: ${data.category}<br/>${valueLabel}: ${formattedValue}`;
        
        tooltip
            .style("display", "block")
            .html(tooltipContent)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px");
    }

    function hideTooltip() {
        tooltip.style("display", "none");
    }

    // ESTRUTURA EXATA DE DETECÇÃO DO SAS VA (COPIADA DO KPI)
    if (isInSASVA()) {
        if (typeof va !== 'undefined' && va.messagingUtil) {
            va.messagingUtil.setOnDataReceivedCallback(handleDataReceived);
        }
        if (typeof va !== 'undefined' && va.contentUtil) {
            va.contentUtil.setupResizeListener(renderChart);
        }
    } else {
        handleDataReceived(SAMPLE_MESSAGE);
        window.addEventListener("resize", renderChart);
    }

    function isInSASVA() {
        try {
            return window.self !== window.top && 
                   typeof va !== 'undefined' && 
                   va.messagingUtil && 
                   va.contentUtil;
        } catch (e) {
            return false;
        }
    }

    function handleDataReceived(messageFromVA) {
        const now = Date.now();
        if (now - lastRenderTime < renderDelay) {
            setTimeout(function() { 
                onDataReceived(messageFromVA); 
            }, renderDelay);
        } else {
            onDataReceived(messageFromVA);
        }
        lastRenderTime = now;
    }

    // PROCESSAMENTO DOS DADOS (ADAPTADO PARA BARRAS)
    function onDataReceived(messageFromVA) {
        vaMessage = messageFromVA;
        VA_RESULT_NAME = messageFromVA.resultName;

        // VALIDAÇÃO EXATA COMO NO KPI
        if (isInSASVA() && typeof va !== 'undefined' && va.contentUtil) {
            const expectedRoles = ["string", "number"];
                
            if (!va.contentUtil.validateRoles(messageFromVA, expectedRoles, false)) {
                if (va.messagingUtil) {
                    va.messagingUtil.postInstructionalMessage(
                        VA_RESULT_NAME,
                        "O Gráfico de Barras Horizontal espera que as colunas sejam atribuídas nesta ordem:\n" +
                        " 1. Categoria (string) - Ex: Município, Região, etc.\n" +
                        " 2. Valor (número) - Ex: Porcentagem, Quantidade, etc.\n\n" +
                        "Todas as categorias serão exibidas com rolagem vertical."
                    );
                }
                return;
            }
        }

        // Se não houver dados, limpa o gráfico
        if (!messageFromVA.data || messageFromVA.data.length === 0) {
            processedData = null;
            d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();
            return;
        }

        // PROCESSAMENTO DOS DADOS
        const columns = messageFromVA.columns;
        const allData = messageFromVA.data;
        
        // Converte TODOS os dados (sem limite de 15)
        const chartData = allData
            .map(function(row) {
                return {
                    category: row[0],
                    value: parseFloat(row[1]) || 0
                };
            })
            .sort(function(a, b) { 
                return b.value - a.value; 
            });

        const limits = calculateDynamicLimits(chartData);
        
        processedData = {
            data: chartData,
            limits: limits,
            columnLabels: {
                category: columns[0].label,
                value: columns[1].label
            }
        };

        console.log("Dados processados (Barras):", processedData);
        renderChart();
    }

    // RENDERIZAÇÃO DO GRÁFICO
    function renderChart() {
        if (!processedData) {
            return;
        }

        const containerWidth = document.body.clientWidth;
        const containerHeight = document.body.clientHeight;
        
        // ALTURA CALCULADA BASEADA NO NÚMERO DE BARRAS (cada barra ~35px + padding)
        const barHeight = 35;
        const totalBars = processedData.data.length;
        const calculatedHeight = Math.max(containerHeight, totalBars * barHeight + 40);

        d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();

        // MARGENS AJUSTADAS
        const margin = {
            top: 10,
            right: 80,
            bottom: 10,
            left: 120
        };

        const chartWidth = containerWidth - margin.left - margin.right;
        const chartHeight = calculatedHeight - margin.top - margin.bottom;

        svg = d3.select("#" + SVG_CONTAINER_ID)
            .append("svg")
            .attr("width", containerWidth)
            .attr("height", calculatedHeight) // ALTURA DINÂMICA
            .style("background-color", "transparent");

        mainGroup = svg.append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        // ESCALAS
        const xScale = d3.scaleLinear()
            .domain([0, d3.max(processedData.data, d => d.value)])
            .range([0, chartWidth]);

        const yScale = d3.scaleBand()
            .domain(processedData.data.map(d => d.category))
            .range([0, chartHeight])
            .padding(0.1);

        // APENAS EIXO Y (removido eixo X completamente) - AGORA SEM TICKS
        mainGroup.append("g")
            .attr("class", "y-axis axis")
            .call(d3.axisLeft(yScale));

        // BARRAS COM CORES DINÂMICAS
        mainGroup.selectAll(".data-bar")
            .data(processedData.data)
            .enter()
            .append("rect")
            .attr("class", "data-bar")
            .attr("x", 0)
            .attr("y", d => yScale(d.category))
            .attr("width", d => xScale(d.value))
            .attr("height", yScale.bandwidth())
            .attr("fill", d => getBarColor(d.value, processedData.limits))
            .on("mouseenter", function(event, d) {
                showTooltip(event, d);
            })
            .on("mouseleave", function() {
                hideTooltip();
            })
            .on("mousemove", function(event, d) {
                showTooltip(event, d);
            });

        // LABELS DE VALOR EM FORMATO DE PORCENTAGEM (igual à imagem)
        mainGroup.selectAll(".value-label")
            .data(processedData.data)
            .enter()
            .append("text")
            .attr("class", "value-label")
            .attr("x", d => xScale(d.value) + 8) // Pequeno espaçamento da barra
            .attr("y", d => yScale(d.category) + yScale.bandwidth() / 2)
            .attr("dy", "0.35em")
            .text(d => formatPercentage(d.value)); // FORMATO DE PORCENTAGEM
    }
}
</script>
</body>
</html>
