<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tabela D3.js com Valores Inteiros</title>
  <!-- Import D3.js -->
  <script src="https://d3js.org/d3.v5.min.js"></script>
</head>
<body>

<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: auto;
  }

  #table-container {
    width: 100%;
    height: 100%;
    padding: 15px;
    box-sizing: border-box;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }

  th, td {
    padding: 8px;
    text-align: left;
    vertical-align: middle;
    border-bottom: 1px solid #ddd;
    word-wrap: break-word;
  }

  thead th {
    font-weight: bold;
    background-color: #f2f2f2;
    border-right: 1px solid #ccc;
    text-align: center;
    vertical-align: middle; 
  }
  
  thead th:last-child {
    border-right: none;
  }

  td.year-cell {
      font-weight: bold;
      text-align: center;
      border-right: 1px solid #ddd;
  }
  
  td.data-cell {
      border-right: 1px solid #ddd;
  }
  td.data-cell:last-of-type {
       border-right: none;
  }

  .bar-container {
    position: relative;
    width: 100%;
    height: 20px;
    display: flex;
    align-items: center;
  }

  .bar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background-color: #3B9EDA; /* Azul */
    border-radius: 2px;
  }

  .bar-text {
    position: relative;
    padding-left: 5px;
    color: #333;
    font-weight: 500;
  }

</style>

<div id="table-container"></div>

<script>
"use strict";

// ** Define o locale para Português (Brasil) para usar o ponto como separador de milhares **
d3.formatDefaultLocale({
  "decimal": ",",
  "thousands": ".",
  "grouping": [3],
  "currency": ["R$", " "]
});


// ** INÍCIO DA SEÇÃO DE DADOS DE EXEMPLO **
const SAMPLE_MESSAGE = {
    version: "1", resultName: "d3IntegerTable",
    data: [
        [2010, "Federal", 98540],
        [2010, "Estadual", 143120],
        [2010, "Privada com fins", 41000],
        [2010, "Privada sem fins", 35600],
        [2011, "Federal", 69230],
        [2011, "Estadual", 45880],
        [2011, "Privada com fins", 55000],
        [2011, "Privada sem fins", 41300],
    ],
    columns: [
        { name: "year", label: "Ano", type: "number" },
        { name: "category", label: "Categoria", type: "string" },
        { name: "value", label: "Valor", type: "number", usage: "quantitative"}
    ]
};
// ** FIM DA SEÇÃO DE DADOS DE EXEMPLO **

let vaMessageReceived = false;

/*************************************************** Setup Callback Functions ***************************************************/
window.addEventListener("message", onMessageReceived);

setTimeout(() => {
    if (!vaMessageReceived) {
        console.warn("Nenhuma mensagem do SAS VA foi recebida. Usando dados de exemplo.");
        onDataReceived(SAMPLE_MESSAGE);
    }
}, 500);

function onMessageReceived(event) {
    if (event && event.data && event.data.resultName) {
        vaMessageReceived = true;
        onDataReceived(event.data);
    }
}

// Função principal que processa os dados e desenha/atualiza a tabela
function onDataReceived(message) {
    if (!message || !message.data || message.data.length === 0) {
        d3.select("#table-container").html("<h1>Sem dados para exibir.</h1>");
        return;
    }

    const yearIndex = message.columns.findIndex(c => c.label === "Ano");
    const categoryIndex = message.columns.findIndex(c => c.label === "Categoria");
    const valueIndex = message.columns.findIndex(c => c.label === "Valor");

    if (yearIndex === -1 || categoryIndex === -1 || valueIndex === -1) {
         d3.select("#table-container").html("<h1>Erro de configuração.</h1><p>Certifique-se de que as colunas 'Ano', 'Categoria' e 'Valor' estão atribuídas.</p>");
        return;
    }
    
    const cleanData = message.data.map(d => ({
        year: d[yearIndex],
        category: d[categoryIndex],
        value: d[valueIndex]
    }));

    const nestedData = d3.nest()
        .key(d => d.year)
        .entries(cleanData);

    const tableData = nestedData.map(group => {
        const rowData = { year: group.key };
        group.values.forEach(item => {
            rowData[item.category] = item.value;
        });
        return rowData;
    }).sort((a, b) => a.year - b.year);

    const categories = [...new Set(message.data.map(d => d[categoryIndex]))];
    
    drawTable(tableData, categories);
}


// Função para desenhar a tabela
function drawTable(data, categories) {
    d3.select("#table-container").html("");

    const table = d3.select("#table-container").append("table");
    const thead = table.append("thead");
    const tbody = table.append("tbody");

    // ** LÓGICA DA BARRA E TEXTO MODIFICADA **
    
    // 1. Encontra o valor máximo em todo o conjunto de dados para a escala da barra
    const maxValue = d3.max(data, d => {
        return d3.max(categories, category => d[category]);
    });

    // 2. A escala da barra agora é dinâmica, baseada no valor máximo.
    const barScale = d3.scaleLinear().domain([0, maxValue]).range([0, 100]).clamp(true);

    // 3. O formato do texto agora é para um número inteiro com separador de milhares.
    const numberFormat = d3.format(",.0f");

    const headers = ["Ano", ...categories];
    const headerRow = thead.append("tr")
        .selectAll("th")
        .data(headers)
        .enter()
        .append("th")
        .text(d => d);
        
    setTimeout(() => {
        headerRow.each(function() {
            const th = d3.select(this);
            const availableWidth = this.clientWidth - 16;
            if (availableWidth > 0) {
                wrapText(th, availableWidth);
            }
        });
    }, 100);

    const rows = tbody.selectAll("tr")
        .data(data)
        .enter()
        .append("tr");

    rows.append("td")
        .attr("class", "year-cell")
        .text(d => d.year);

    categories.forEach(category => {
        rows.append("td")
            .attr("class", "data-cell")
            .each(function(d) {
                const cell = d3.select(this);
                const value = d[category];

                if (value !== undefined && value !== null) {
                    const container = cell.append("div").attr("class", "bar-container");
                    
                    container.append("div")
                        .attr("class", "bar")
                        .style("width", barScale(value) + "%");
                    
                    container.append("span")
                        .attr("class", "bar-text")
                        .text(numberFormat(value)); // Usa o novo formato
                }
            });
    });
}

// Lógica de quebra de texto para HTML
const measureSvg = d3.select("body").append("svg")
    .style("position", "absolute").style("visibility", "hidden")
    .attr("width", 0).attr("height", 0);
const measureText = measureSvg.append("text");

function wrapText(textElement, width) {
    const originalText = textElement.text();
    const words = originalText.split(/\s+/).reverse();
    
    if (words.length <= 1) return;

    const computedStyle = window.getComputedStyle(textElement.node());
    measureText
        .style('font-size', computedStyle.fontSize)
        .style('font-family', computedStyle.fontFamily)
        .style('font-weight', computedStyle.fontWeight);

    let word;
    let line = [];
    let lines = [];

    while (word = words.pop()) {
        line.push(word);
        measureText.text(line.join(" "));
        if (measureText.node().getComputedTextLength() > width && line.length > 1) {
            line.pop();
            lines.push(line.join(" "));
            line = [word];
        }
    }
    lines.push(line.join(" "));
    
    textElement.html(lines.join("<br>"));
}

window.addEventListener('resize', () => {
    if (window.SAS_LAST_MESSAGE) {
        onDataReceived(window.SAS_LAST_MESSAGE);
    }
});

window.addEventListener("message", (event) => {
    if (event && event.data && event.data.resultName) {
        window.SAS_LAST_MESSAGE = event.data;
    }
});

</script>

</body>
</html>
