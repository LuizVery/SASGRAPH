<html>
<head>
  <title>D3 Donut Chart by Measures</title>
  <!-- Import D3.js -->
  <script src="https://d3js.org/d3.v5.min.js"></script>

  <!--
    NOTE: The original script tags for messagingUtil.js and contentUtil.js have been removed.
    A mock 'va' object is included below for standalone functionality and testing.
    In a real SAS VA environment, these files provide the 'va' object.
  -->
</head>
<body>
<style type="text/css">
  html, body, svg {
    overflow: hidden;
    margin: 0px;
    padding: 0px;
    width: 100%;
    height: 100%;
    font-family: sans-serif;
  }

  .selectable.selected {
    stroke-width: 2px;
    stroke: #333;
    stroke-opacity: 0.8;
  }

  .legend-title {
    font-size: .9em;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: hanging;
  }

  .legend-text {
    font-size: .8em;
    dominant-baseline: central;
  }

  .legend-rect {
    stroke-width: 1px;
    stroke: #ccc;
  }
</style>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", function() {
  /******************************************************* Declare variables *******************************************************/

  // Static data variables
  const SVG_ID = "donut"; // ID of SVG element

  // --- MODIFICATION ---
  // Sample data now uses multiple measure columns instead of a category and a measure.
  // Each value in the data array corresponds to a column in the columns array.
  const SAMPLE_MESSAGE = {
    version: "1",
    resultName: "financials_q1",
    rowCount: 1,
    availableRowCount: 1,
    data: [
      [150000, 85000, 45000, 25000] // Values for: Gross Revenue, Operating Costs, Net Profit, Taxes
    ],
    columns: [
      { name: "measure1", label: "Gross Revenue", type: "number", usage: "quantitative" },
      { name: "measure2", label: "Operating Costs", type: "number", usage: "quantitative" },
      { name: "measure3", label: "Net Profit", type: "number", usage: "quantitative" },
      { name: "measure4", label: "Taxes", type: "number", usage: "quantitative" }
    ]
  };

  // Mock VA object for standalone development.
  // In a real SAS VA environment, this object is provided by the imported util scripts.
  const va = window.va || {
      messagingUtil: {
          setOnDataReceivedCallback: function(callback) {
              // For standalone testing, we call the callback with sample data.
              // In a real environment, SAS VA would trigger this.
              if (!inIframe()) {
                callback(SAMPLE_MESSAGE);
              }
          },
          postSelectionMessage: function(resultName, selections) {
              console.log("Mock Selection Message Sent:", { resultName, selections });
          },
          postInstructionalMessage: function(resultName, message) {
              console.error("Instructional Message:", { resultName, message });
              const svg = d3.select("#" + SVG_ID);
              if (!svg.empty()) {
                  svg.remove();
              }
              d3.select("body").append("div")
                .style("margin", "20px")
                .style("font-family", "sans-serif")
                .html(message.replace(/\n/g, '<br/>'));
          }
      },
      contentUtil: {
          setupResizeListener: function(callback) {
              window.addEventListener("resize", callback);
          }
      }
  };

  // Dynamic data variables
  let VA_MESSAGE; // Data message to be received from VA
  let VA_RESULT_NAME; // Result name required to send messages back to VA
  let DATA; // Data to be parsed from VA data message

  // Static dimension variables
  const TRANS_TIME = 500; // Duration of transitions
  const EDGE_PADDING = 10; // Padding around exterior of donut
  const RING_WIDTH_RATIO = 0.35; // Proportion of radius to use as donut width

  // Dynamic dimension variables
  let WIDTH; // Width of SVG element
  let HEIGHT; // Height of SVG element
  let RADIUS; // Radius of pie/donut

  // Selection and d3 variables
  const COLOR_SCALE = d3.scaleOrdinal(d3.schemeCategory10); // Using a different color scheme
  let SVG; // SVG selection
  let G_CHART_AREA; // Chart area group selection
  let DATA_ARCS; // Data Arcs data-join

  // Legend variables
  const LEG = {
    topPad: 20,
    titlePad: 5,
    rowPad: 3,
    rectWidth: 12,
    rectPad: 5,
    textPad: 5,
    title: undefined,
    data: undefined,
    elPos: undefined,
    height: undefined,
    groupSelection: undefined,
    titleDataJoin: undefined,
    rectsDataJoin: undefined,
    textsDataJoin: undefined
  };

  /*************************************************** Setup Callback Functions ***************************************************/

  // Attach event for data message from VA
  va.messagingUtil.setOnDataReceivedCallback(onDataReceived);

  // Listen for resize event
  va.contentUtil.setupResizeListener(drawElements);

  /****************************************************** Callback Functions ******************************************************/

  /**
   * Processes the data message from VA.
   * This function has been MODIFIED to handle a wide data format where each column is a measure.
   * @param {object} messageFromVA - The data message from SAS Visual Analytics.
   */
  function onDataReceived(messageFromVA) {
    if (!messageFromVA || !messageFromVA.data || messageFromVA.data.length === 0) {
      return;
    }

    VA_MESSAGE = messageFromVA;
    VA_RESULT_NAME = messageFromVA.resultName;

    // --- MODIFICATION START ---
    // Validate that all columns are numeric measures.
    const allColsAreNumeric = VA_MESSAGE.columns.every(c => c.type === "number");
    if (!allColsAreNumeric) {
      va.messagingUtil.postInstructionalMessage(
        VA_RESULT_NAME,
        "D3 Donut Chart by Measures expects all assigned columns to be measures (numeric)."
      );
      return;
    }

    // Restructure data from a wide format (1 row, N measures) to an array of objects for D3.
    const measureValues = VA_MESSAGE.data[0];
    const measureColumns = VA_MESSAGE.columns;
    const total = d3.sum(measureValues);
    let startAngle = 0;
    DATA = [];

    for (let i = 0; i < measureColumns.length; i++) {
      const value = measureValues[i];
      DATA.push({
        category: measureColumns[i].label, // Use column label as the "category" for the slice.
        measure: value,
        selected: false, // Selection is now visual only.
        startAngle: startAngle,
        endAngle: startAngle + (value / total) * 2 * Math.PI,
        index: i // This index now refers to the COLUMN index.
      });
      startAngle = DATA[i].endAngle;
    }

    // Assign data for the legend.
    LEG.title = "Measures Summary"; // Title is static as there's no single category column.
    LEG.data = DATA.map(d => d.category);
    // --- MODIFICATION END ---

    if (d3.select("#" + SVG_ID).empty()) {
      drawElements();
    } else {
      updateElements();
    }
  }

  // Draw elements for first time and on resize event
  function drawElements() {
    if (!DATA) return;

    WIDTH = window.innerWidth;
    HEIGHT = window.innerHeight;

    d3.select("body").selectAll("#" + SVG_ID).remove(); // Clear previous SVG on redraw

    SVG = d3.select("body")
      .append("svg")
      .attr("id", SVG_ID)
      .attr("width", WIDTH)
      .attr("height", HEIGHT)
      .on("click", deselectAllElements);

    calculateLegendDimensions();
    drawLegend();

    RADIUS = Math.min(WIDTH - 2 * EDGE_PADDING, HEIGHT - LEG.height - LEG.topPad - EDGE_PADDING) / 2;

    DATA.forEach(d => {
      d.innerRadius = (1 - RING_WIDTH_RATIO) * RADIUS;
      d.outerRadius = RADIUS;
    });

    G_CHART_AREA = SVG.append("g")
      .classed("g-chart-area", true)
      .attr("transform", `translate(${WIDTH / 2}, ${RADIUS + EDGE_PADDING})`);

    DATA_ARCS = G_CHART_AREA.selectAll(".data-arc")
      .data(DATA, d => d.category);

    DATA_ARCS.enter()
      .append("path")
      .classed("data-arc selectable", true)
      .classed("selected", d => d.selected)
      .attr("fill", d => COLOR_SCALE(d.category))
      .on("click", selectElement)
      .merge(DATA_ARCS)
      .attr("d", d3.arc())
      .each(function(d) {
        this._current = { ...d };
      });
  }

  // Redraw data dependent elements on data change
  function updateElements() {
    calculateLegendDimensions();
    updateLegend();

    RADIUS = Math.min(WIDTH - 2 * EDGE_PADDING, HEIGHT - LEG.height - LEG.topPad - EDGE_PADDING) / 2;

    DATA.forEach(d => {
      d.innerRadius = (1 - RING_WIDTH_RATIO) * RADIUS;
      d.outerRadius = RADIUS;
    });

    G_CHART_AREA.transition().duration(TRANS_TIME)
      .attr("transform", `translate(${WIDTH / 2}, ${RADIUS + EDGE_PADDING})`);

    DATA_ARCS = G_CHART_AREA.selectAll(".data-arc").data(DATA, d => d.category);

    DATA_ARCS.classed("selected", d => d.selected)
      .transition().duration(TRANS_TIME)
      .attrTween("d", arcTween);

    DATA_ARCS.enter()
      .append("path")
      .classed("data-arc selectable", true)
      .classed("selected", d => d.selected)
      .attr("fill", d => COLOR_SCALE(d.category))
      .on("click", selectElement)
      .each(function(d) {
        const i = d3.interpolate(this._current, d);
        this._current = i(0);
        const sibling = this.previousElementSibling || this.nextElementSibling;
        if (sibling && sibling._current) {
            this._current = {...sibling._current, startAngle: sibling._current.endAngle, endAngle: sibling._current.endAngle};
        } else {
            this._current = { startAngle: 0, endAngle: 0, innerRadius: RADIUS * (1 - RING_WIDTH_RATIO), outerRadius: RADIUS };
        }
      })
      .transition().duration(TRANS_TIME)
      .attrTween("d", arcTween);

    DATA_ARCS.exit()
      .classed("selected", false)
      .transition().duration(TRANS_TIME)
      .attrTween("d", function(d) {
          const endPoint = this.previousElementSibling ? d3.select(this.previousElementSibling).datum().endAngle : 0;
          const i = d3.interpolate(this._current, {...d, startAngle: endPoint, endAngle: endPoint});
          return t => d3.arc()(i(t));
      })
      .remove();
  }

  /******************************************************* Helper Functions *******************************************************/

  function inIframe() {
    try {
      return window.self !== window.top;
    } catch (e) {
      return true;
    }
  }

  /**
   * Deselects all elements visually.
   * MODIFIED: Removed call to postSelectionMessage.
   */
  function deselectAllElements() {
    d3.selectAll(".selectable").classed("selected", false);
    // The call to va.messagingUtil.postSelectionMessage was removed because selections
    // are row-based, and this chart's data is now column-based.
  }

  /**
   * Handles visual selection on an element.
   * MODIFIED: Removed call to postSelectionMessage.
   */
  function selectElement() {
    d3.event.stopPropagation();

    if (d3.event.ctrlKey) {
      d3.select(this).classed("selected", !d3.select(this).classed("selected"));
    } else {
      const isSelected = d3.select(this).classed("selected");
      d3.selectAll(".selectable").classed("selected", false);
      d3.select(this).classed("selected", !isSelected);
    }
    // The call to va.messagingUtil.postSelectionMessage was removed. The original code
    // would send `{ row: d.index }`, but here `d.index` is a column index, not a row
    // index, which is incompatible with the VA messaging API.
  }

  function calculateLegendDimensions() {
    // Create dummy text elements to measure sizes
    const tempSvg = d3.select("body").append("svg").style("visibility", "hidden");
    let titleHeight = 0;
    tempSvg.append("text").classed("legend-title", true).text("T").each(function() {
      titleHeight = this.getBBox().height;
    });

    const textWidths = [];
    let textHeight = 0;
    tempSvg.selectAll(".dummyText").data(LEG.data).enter()
      .append("text").classed("legend-text", true)
      .text(d => d)
      .each(function() {
        textHeight = this.getBBox().height;
        textWidths.push(this.getComputedTextLength());
      });
    tempSvg.remove();

    const rows = [];
    const rowSums = [];
    let currentRow = 0;
    for (let i = 0; i < textWidths.length; i++) {
        let rowSum = 0;
        let rowStartIndex = i;
        while (i < textWidths.length && rowSum + textWidths[i] + LEG.rectWidth + LEG.rectPad + LEG.textPad < WIDTH) {
            rowSum += textWidths[i] + LEG.rectWidth + LEG.rectPad + LEG.textPad;
            rows[i] = currentRow;
            i++;
        }
        rowSums.push(rowSum);
        if (i < textWidths.length) {
            rows[i] = currentRow;
            i--;
        }
        currentRow++;
    }


    LEG.elPos = [];
    for (let i = 0; i < textWidths.length; i++) {
      LEG.elPos.push({
        x: i === 0 || rows[i] !== rows[i - 1] ?
          WIDTH / 2 - rowSums[rows[i]] / 2 :
          LEG.elPos[i - 1].x + textWidths[i - 1] + LEG.rectWidth + LEG.rectPad + LEG.textPad,
        y: titleHeight + LEG.titlePad + rows[i] * (textHeight + LEG.rowPad)
      });
    }

    LEG.height = LEG.elPos.length > 0 ? LEG.elPos[LEG.elPos.length - 1].y + textHeight + LEG.rowPad : titleHeight;
  }

  function drawLegend() {
    LEG.groupSelection = SVG.append("g").classed("g-legend", true);

    LEG.titleDataJoin = LEG.groupSelection.selectAll(".legend-title").data([LEG.title]);
    LEG.titleDataJoin.enter().append("text").classed("legend-title", true)
      .merge(LEG.titleDataJoin)
      .attr("transform", `translate(${WIDTH / 2}, 0)`)
      .text(d => d);

    LEG.rectsDataJoin = LEG.groupSelection.selectAll(".legend-rect").data(LEG.data, d => d);
    LEG.rectsDataJoin.enter().append("rect").classed("legend-rect", true)
      .merge(LEG.rectsDataJoin)
      .attr("width", LEG.rectWidth).attr("height", LEG.rectWidth)
      .attr("fill", d => COLOR_SCALE(d))
      .attr("x", (d, i) => LEG.elPos[i].x)
      .attr("y", (d, i) => LEG.elPos[i].y);

    LEG.textsDataJoin = LEG.groupSelection.selectAll(".legend-text").data(LEG.data, d => d);
    LEG.textsDataJoin.enter().append("text").classed("legend-text", true)
      .merge(LEG.textsDataJoin)
      .text(d => d)
      .attr("x", (d, i) => LEG.elPos[i].x + LEG.rectWidth + LEG.rectPad)
      .attr("y", (d, i) => LEG.elPos[i].y + LEG.rectWidth / 2);

    LEG.groupSelection.attr("transform", `translate(0, ${HEIGHT - LEG.height})`);
  }

  function updateLegend() {
    LEG.groupSelection.attr("transform", `translate(0, ${HEIGHT - LEG.height})`);

    LEG.rectsDataJoin = LEG.groupSelection.selectAll(".legend-rect").data(LEG.data, d => d);
    LEG.rectsDataJoin.exit().transition().duration(TRANS_TIME).style("opacity", 0).remove();
    LEG.rectsDataJoin.enter().append("rect").classed("legend-rect", true)
      .attr("width", LEG.rectWidth).attr("height", LEG.rectWidth)
      .attr("fill", d => COLOR_SCALE(d))
      .style("opacity", 0)
      .merge(LEG.rectsDataJoin)
      .transition().duration(TRANS_TIME)
      .attr("x", (d, i) => LEG.elPos[i].x)
      .attr("y", (d, i) => LEG.elPos[i].y)
      .style("opacity", 1);

    LEG.textsDataJoin = LEG.groupSelection.selectAll(".legend-text").data(LEG.data, d => d);
    LEG.textsDataJoin.exit().transition().duration(TRANS_TIME).style("opacity", 0).remove();
    LEG.textsDataJoin.enter().append("text").classed("legend-text", true)
      .text(d => d)
      .style("opacity", 0)
      .merge(LEG.textsDataJoin)
      .transition().duration(TRANS_TIME)
      .attr("x", (d, i) => LEG.elPos[i].x + LEG.rectWidth + LEG.rectPad)
      .attr("y", (d, i) => LEG.elPos[i].y + LEG.rectWidth / 2)
      .style("opacity", 1);
  }

  function arcTween(d) {
    const i = d3.interpolate(this._current, d);
    this._current = i(0);
    return t => d3.arc()(i(t));
  }
});
</script>
</body>
</html>
