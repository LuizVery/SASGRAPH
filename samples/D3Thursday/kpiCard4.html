<!DOCTYPE html>
<!--
Adaptado para SAS Visual Analytics.
Estrutura baseada no exemplo D3 Radar Chart fornecido pela SAS.
Lógica do card KPI e design fornecidos pelo usuário.
VERSÃO ADAPTADA: Trabalha com múltiplas linhas ao invés de arrays
MODIFICAÇÃO: Layout horizontal - gráfico alargado, variações compactas
ATUALIZAÇÃO: Tooltip formatado com labels das colunas
MELHORIAS: Layout responsivo horizontal, fonte Avenir Next, valores destacados, tooltips
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>KPI Card with Formatted Tooltip para SAS VA</title>
    <!-- Import D3.js -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA (apenas se disponível) -->
    <script type="text/javascript">
        // Verifica se os utilitários do SAS VA estão disponíveis antes de importar
        if (typeof window !== 'undefined' && window.self !== window.top) {
            // Está em iframe, pode tentar carregar os utilitários do SAS
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    /* Estilos globais para garantir que o SVG preencha o espaço */
    html, body, svg {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Evita barras de rolagem indesejadas */
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5; /* Cor de fundo para modo de depuração */
    }

    /* Estilos para os textos dentro do card - COM MAIS DESTAQUE */
    .title-text {
        fill: #1a4f0e;
        font-weight: 700;
        text-anchor: middle;
        text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    .main-label-text {
        fill: #2d5016;
        font-weight: 600;
    }

    .main-value-text {
        fill: #1a4f0e;
        font-weight: 700;
        text-shadow: 0px 2px 4px rgba(0,0,0,0.15);
    }

    .secondary-label-text {
        fill: #2d5016;
        font-weight: 600;
        text-anchor: middle;
    }

    .secondary-value-text {
        fill: #1a4f0e;
        font-weight: 700;
        text-anchor: middle;
        text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    /* Estilos para o tooltip */
    .tooltip {
        position: absolute;
        background-color: rgba(26, 79, 14, 0.95);
        color: white;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        pointer-events: none;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.2);
        display: none;
        line-height: 1.4;
    }

    .tooltip::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: rgba(26, 79, 14, 0.95);
    }
</style>

<div id="chart-container"></div>
<!-- Tooltip element -->
<div id="tooltip" class="tooltip"></div>

<script>
"use strict";

// Função para aguardar o carregamento do D3
function waitForD3(callback) {
    if (typeof d3 !== 'undefined') {
        callback();
    } else {
        setTimeout(function() { 
            waitForD3(callback); 
        }, 100);
    }
}

// Aguarda tanto o DOM quanto o D3 estarem prontos
document.addEventListener("DOMContentLoaded", function() {
    waitForD3(function() {
        initializeKPICard();
    });
});

function initializeKPICard() {
    /*******************************************************
     * DECLARAÇÃO DE VARIÁVEIS               *
     *******************************************************/

    // Constantes e configurações
    const SVG_CONTAINER_ID = "chart-container"; // ID do container do gráfico
    let VA_RESULT_NAME; // Nome do resultado para comunicação com o VA

    // Dados dinâmicos
    let vaMessage; // Mensagem de dados recebida do VA
    let processedData; // Dados processados e prontos para uso
    let lastRenderTime = 0; // Para debouncing de atualizações
    const renderDelay = 250; // Atraso para evitar renderizações excessivas

    // Elementos D3
    let svg, mainGroup;

    // Tooltip
    const tooltip = d3.select("#tooltip");

    /*******************************************************
     * FUNÇÃO DE FORMATAÇÃO PERSONALIZADA      *
     *******************************************************/
    
    /**
     * Formata valores com máximo 3 dígitos e sem .0 desnecessário
     * @param {number} value - Valor a ser formatado
     * @returns {string} - Valor formatado
     */
    function formatValue(value) {
        if (value >= 1000000000) {
            // Para bilhões
            const billions = value / 1000000000;
            if (billions >= 100) {
                return Math.round(billions) + "B"; // 100B, 150B, etc.
            } else if (billions >= 10) {
                return d3.format(".1f")(billions).replace(/\.0$/, "") + "B"; // 10.1B, 15.7B, etc.
            } else {
                return d3.format(".2f")(billions).replace(/\.00$/, "").replace(/0$/, "") + "B"; // 1.25B, 9.8B, etc.
            }
        } else if (value >= 1000000) {
            // Para milhões
            const millions = value / 1000000;
            if (millions >= 100) {
                return Math.round(millions) + "M"; // 100M, 150M, etc.
            } else if (millions >= 10) {
                return d3.format(".1f")(millions).replace(/\.0$/, "") + "M"; // 10.1M, 15.7M, etc.
            } else {
                return d3.format(".2f")(millions).replace(/\.00$/, "").replace(/0$/, "") + "M"; // 1.25M, 9.8M, etc.
            }
        } else if (value >= 1000) {
            // Para milhares
            const thousands = value / 1000;
            if (thousands >= 100) {
                return Math.round(thousands) + "K"; // 100K, 150K, etc.
            } else if (thousands >= 10) {
                return d3.format(".1f")(thousands).replace(/\.0$/, "") + "K"; // 10.1K, 15.7K, etc.
            } else {
                return d3.format(".2f")(thousands).replace(/\.00$/, "").replace(/0$/, "") + "K"; // 1.25K, 9.8K, etc.
            }
        } else {
            // Para valores menores que 1000 - SEM casas decimais desnecessárias
            if (value === Math.floor(value)) {
                return Math.round(value).toString(); // 123, 45, 7, etc.
            } else {
                return d3.format(".1f")(value).replace(/\.0$/, ""); // 123.5, mas não 123.0
            }
        }
    }

    /**
     * Formata valores para tooltip (mais completo, sem abreviações para números pequenos)
     * @param {number} value - Valor a ser formatado
     * @returns {string} - Valor formatado para tooltip
     */
    function formatValueForTooltip(value) {
        if (value >= 1000000000) {
            // Para bilhões (mantém formatação abreviada)
            const billions = value / 1000000000;
            if (billions >= 100) {
                return Math.round(billions) + "B";
            } else if (billions >= 10) {
                return d3.format(".1f")(billions).replace(/\.0$/, "") + "B";
            } else {
                return d3.format(".2f")(billions).replace(/\.00$/, "").replace(/0$/, "") + "B";
            }
        } else if (value >= 1000000) {
            // Para milhões (mantém formatação abreviada)
            const millions = value / 1000000;
            if (millions >= 100) {
                return Math.round(millions) + "M";
            } else if (millions >= 10) {
                return d3.format(".1f")(millions).replace(/\.0$/, "") + "M";
            } else {
                return d3.format(".2f")(millions).replace(/\.00$/, "").replace(/0$/, "") + "M";
            }
        } else if (value >= 10000) {
            // Para valores grandes em milhares (mostra formato abreviado)
            const thousands = value / 1000;
            if (thousands >= 100) {
                return Math.round(thousands) + "K";
            } else if (thousands >= 10) {
                return d3.format(".1f")(thousands).replace(/\.0$/, "") + "K";
            } else {
                return d3.format(".2f")(thousands).replace(/\.00$/, "").replace(/0$/, "") + "K";
            }
        } else {
            // Para valores menores que 10000 - mostra número completo formatado
            return d3.format(",")(Math.round(value));
        }
    }

    /*******************************************************
     * FUNÇÕES DO TOOLTIP                    *
     *******************************************************/
    
    function showTooltip(event, data) {
        // Usa as labels das colunas para criar o tooltip
        const periodLabel = processedData.columnLabels.period || "Período";
        const valueLabel = processedData.columnLabels.value || "Valor";
        const formattedValue = formatValueForTooltip(data.value);
        
        const tooltipContent = `${periodLabel}: ${data.period}<br/>${valueLabel}: ${formattedValue}`;
        
        tooltip
            .style("display", "block")
            .html(tooltipContent)
            .style("left", (event.pageX - tooltip.node().offsetWidth / 2) + "px")
            .style("top", (event.pageY - tooltip.node().offsetHeight - 10) + "px");
    }

    function hideTooltip() {
        tooltip.style("display", "none");
    }

    /*******************************************************
     * CONFIGURAÇÃO PARA DEBUG FORA DO SAS VA      *
     *******************************************************/
    // Mensagem de dados de exemplo para renderizar o gráfico fora do VA para depuração
    // Simula múltiplas linhas como virão do SAS VA
    const SAMPLE_MESSAGE = {
        resultName: "kpiCardSample",
        rowCount: 6,
        data: [
            ["Vendas Anuais", 2019, 1250000],
            ["Vendas Anuais", 2020, 1380000],
            ["Vendas Anuais", 2021, 1420000],
            ["Vendas Anuais", 2022, 1650000],
            ["Vendas Anuais", 2023, 1850000],
            ["Vendas Anuais", 2024, 1920000]
        ],
        columns: [
            { label: "Título", type: "string" },
            { label: "Ano", type: "number" },
            { label: "Número de Vendas", type: "number", format: { name: "BEST", precision: 0 } }
        ]
    };

    /*******************************************************
     * FUNÇÕES DE CALLBACK DO SAS VA          *
     *******************************************************/

    if (isInSASVA()) {
        // Este bloco é executado APENAS DENTRO do SAS Visual Analytics
        // Define a função de callback para receber dados do SAS VA
        if (typeof va !== 'undefined' && va.messagingUtil) {
            va.messagingUtil.setOnDataReceivedCallback(handleDataReceived);
        }

        // Define a função de callback para redimensionamento da janela
        if (typeof va !== 'undefined' && va.contentUtil) {
            va.contentUtil.setupResizeListener(renderCard);
        }
    } else {
        // Este bloco é executado FORA do SAS VA (para debug local)
        // Usa os dados de exemplo para renderizar o card
        handleDataReceived(SAMPLE_MESSAGE);
        // Adiciona um listener de redimensionamento padrão do navegador
        window.addEventListener("resize", renderCard);
    }

    /**
     * Verifica se está rodando dentro do SAS Visual Analytics
     * @returns {boolean} - Verdadeiro se estiver no SAS VA
     */
    function isInSASVA() {
        try {
            // Verifica se está em iframe E se o objeto va está disponível
            return window.self !== window.top && 
                   typeof va !== 'undefined' && 
                   va.messagingUtil && 
                   va.contentUtil;
        } catch (e) {
            return false;
        }
    }

    /**
     * Controla o fluxo de recebimento de dados para evitar atualizações simultâneas.
     * @param {object} messageFromVA - O objeto de dados enviado pelo SAS VA.
     */
    function handleDataReceived(messageFromVA) {
        const now = Date.now();
        if (now - lastRenderTime < renderDelay) {
            setTimeout(function() { 
                onDataReceived(messageFromVA); 
            }, renderDelay);
        } else {
            onDataReceived(messageFromVA);
        }
        lastRenderTime = now;
    }

    /**
     * Processa os dados recebidos do SAS VA e inicia a renderização.
     * @param {object} messageFromVA - O objeto de dados.
     */
    function onDataReceived(messageFromVA) {
        vaMessage = messageFromVA;
        VA_RESULT_NAME = messageFromVA.resultName;

        // Validação de papéis (roles): espera dados temporais com múltiplas linhas
        if (isInSASVA() && typeof va !== 'undefined' && va.contentUtil) {
            const expectedRoles = ["string", "number", "number"];
                
            if (!va.contentUtil.validateRoles(messageFromVA, expectedRoles, false)) {
                if (va.messagingUtil) {
                    va.messagingUtil.postInstructionalMessage(
                        VA_RESULT_NAME,
                        "O Card KPI com Tendência Temporal espera que as colunas sejam atribuídas nesta ordem:\n" +
                        " 1. Título (string) - Nome do KPI\n" +
                        " 2. Período (número) - Ano ou período temporal\n" +
                        " 3. Valor Temporal (número) - Valor para cada período\n\n" +
                        "IMPORTANTE: Cada linha representa um período temporal diferente."
                    );
                }
                return;
            }
        }

        // Se não houver dados, limpa o gráfico e sai
        if (!messageFromVA.data || messageFromVA.data.length === 0) {
            processedData = null;
            d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();
            return;
        }

        // Processa os dados das múltiplas linhas
        const columns = messageFromVA.columns;
        const allData = messageFromVA.data;
        
        // Agrupa os dados temporais
        const timeSeriesData = [];
        let titulo = "";
        
        // Processa cada linha de dados
        allData.forEach(function(row, index) {
            if (index === 0) {
                // Pega informações da primeira linha
                titulo = row[0];
            }
            
            // Adiciona ponto temporal
            timeSeriesData.push({
                periodo: row[1], // Ano ou período
                valor: row[2]    // Valor temporal
            });
        });
        
        // Ordena por período para garantir ordem cronológica
        timeSeriesData.sort(function(a, b) { 
            return a.periodo - b.periodo; 
        });
        
        // Calcula valores derivados
        const valores = timeSeriesData.map(function(d) { return d.valor; });
        const ultimoValor = valores[valores.length - 1];
        const primeiroValor = valores[0];
        const penultimoValor = valores.length > 1 ? valores[valores.length - 2] : null;
        
        // CÁLCULO: Variação em pontos percentuais no período
        let variacaoPeriodo = 0;
        if (primeiroValor !== null && ultimoValor !== null) {
            variacaoPeriodo = ultimoValor - primeiroValor; // Diferença absoluta em pontos percentuais
        }
        
        // CÁLCULO: Variação em pontos percentuais vs ano anterior
        let variacaoAnterior = 0;
        if (penultimoValor !== null && ultimoValor !== null) {
            variacaoAnterior = ultimoValor - penultimoValor; // Diferença absoluta em pontos percentuais
        }

        // CÁLCULO CORRIGIDO: Média anual das variações em pontos percentuais
        let mediaAnual = 0;
        if (valores.length > 1) {
            // Calcula as variações ano a ano em pontos percentuais
            const variacoesAnuais = [];
            for (let i = 1; i < valores.length; i++) {
                const variacaoAnual = valores[i] - valores[i - 1]; // Diferença absoluta entre anos consecutivos
                variacoesAnuais.push(variacaoAnual);
            }
            
            // Calcula a média das variações anuais
            if (variacoesAnuais.length > 0) {
                const somaVariacoes = variacoesAnuais.reduce(function(soma, variacao) { 
                    return soma + variacao; 
                }, 0);
                mediaAnual = somaVariacoes / variacoesAnuais.length;
            }
        }
        
        processedData = {
            titulo: titulo,
            // Labels das colunas para usar no tooltip
            columnLabels: {
                period: columns[1].label, // Ex: "Ano", "Ano do censo"
                value: columns[2].label   // Ex: "Número de Vendas", "Número de escolas"
            },
            valorPrincipal: {
                label: "Variação no Período",
                value: variacaoPeriodo,
                format: function(val) { 
                    // APENAS 1 casa decimal
                    return val !== null ? d3.format("+.1f")(val) + " pp" : "N/A";
                }
            },
            // Valores em pontos percentuais com APENAS 1 casa decimal
            valorSecundario: {
                label: "Variação vs Ano Anterior",
                value: variacaoAnterior,
                format: function(val) { 
                    // APENAS 1 casa decimal
                    return val !== null ? d3.format("+.1f")(val) + " pp" : "N/A";
                }
            },
            valorTerciario: {
                label: "Média Anual", // Média das variações anuais
                value: mediaAnual,
                format: function(val) { 
                    // APENAS 1 casa decimal (com sinal +/- para mostrar se é crescimento ou decrescimento)
                    return val !== null ? d3.format("+.1f")(val) + " pp" : "N/A";
                }
            },
            // Dados temporais para linha de tendência
            serieTemporal: {
                dados: timeSeriesData,
                valores: valores,
                periodos: timeSeriesData.map(function(d) { return d.periodo.toString(); }),
                label: columns[2].label
            }
        };

        renderCard();
    }

    /*******************************************************
     * FUNÇÃO PRINCIPAL DE RENDERIZAÇÃO      *
     *******************************************************/

    /**
     * Renderiza ou atualiza o card KPI no SVG.
     * Esta função é chamada na primeira carga, em atualizações de dados e em redimensionamentos.
     */
    function renderCard() {
        if (!processedData) {
            return;
        }

        // Obtém as dimensões do container
        const width = document.body.clientWidth;
        const height = document.body.clientHeight;

        // Detecta se é um formato compacto horizontal (como 677x203)
        const isCompactHorizontal = (width / height) > 2.5;
        
        // Limpa o container antes de desenhar
        d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();

        // Cria o elemento SVG principal
        svg = d3.select("#" + SVG_CONTAINER_ID)
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // --- Definição do Gradiente CORRIGIDO: Branco predominante com verde suave ---
        const defs = svg.append("defs");
        const gradient = defs.append("linearGradient")
            .attr("id", "cardGradient")
            .attr("x1", "0%").attr("y1", "0%")
            .attr("x2", "100%").attr("y2", "100%");
        gradient.append("stop").attr("offset", "0%").attr("stop-color", "#ffffff");
        gradient.append("stop").attr("offset", "100%").attr("stop-color", "#4CAF50");

        // --- Fundo do Card com Borda ---
        svg.append("rect")
            .attr("width", width)
            .attr("height", height)
            .attr("rx", 8) // Bordas arredondadas
            .attr("fill", "url(#cardGradient)")
            .attr("stroke", "#d0d0d0")
            .attr("stroke-width", 1);

        // Agrupador principal para facilitar o posicionamento
        mainGroup = svg.append("g");
        
        // --- Cálculo de Posições e Tamanhos Responsivos OTIMIZADOS PARA FORMATO COMPACTO ---
        const padding = Math.max(width * 0.015, 8); // Padding reduzido para formato compacto
        const contentWidth = width - (padding * 2);
        
        // TAMANHOS DE FONTE AINDA MENORES PARA O TÍTULO
        let titleFontSize, labelFontSize, valueFontSize, titleHeight;
        
        if (isCompactHorizontal) {
            // Para formatos muito horizontais (como 677x203) - TÍTULO AINDA MENOR
            titleFontSize = Math.min(Math.max(height * 0.1, 12), 16);
            labelFontSize = Math.min(Math.max(height * 0.12, 10), 16);
            valueFontSize = Math.min(Math.max(height * 0.16, 12), 20);
            titleHeight = Math.max(height * 0.18, 25);
        } else {
            // Para formatos mais quadrados/normais - TÍTULO MENOR TAMBÉM
            titleFontSize = Math.min(Math.max(height * 0.07, 16), width * 0.045, 24);
            labelFontSize = Math.min(Math.max(height * 0.07, 16), width * 0.04, 24);
            valueFontSize = Math.min(Math.max(height * 0.09, 20), width * 0.05, 30);
            titleHeight = Math.max(height * 0.12, 45);
        }

        // --- Layout Horizontal Responsivo ADAPTADO - GRÁFICO MAIS LARGO ---
        const contentSectionHeight = height - titleHeight - padding;
        
        // NOVA DIVISÃO: Mais espaço para gráfico, menos para variações
        let chartWidthRatio, variationsWidthRatio;
        if (isCompactHorizontal) {
            // Para formato compacto: 72% gráfico, 28% variações (era 58%/42%)
            chartWidthRatio = 0.72;
            variationsWidthRatio = 0.28;
        } else {
            // Para formato normal: 75% gráfico, 25% variações (era 65%/35%)
            chartWidthRatio = 0.75;
            variationsWidthRatio = 0.25;
        }
        
        const chartWidth = Math.max(contentWidth * chartWidthRatio, 180); // Mínimo aumentado
        const variationsWidth = contentWidth - chartWidth - padding;

        // --- Título Principal (AINDA MENOR) ---
        mainGroup.append("text")
            .attr("class", "title-text")
            .attr("x", width / 2)
            .attr("y", padding + titleFontSize * 0.8)
            .attr("font-size", titleFontSize + "px")
            .text(processedData.titulo);

        // --- Seção do Gráfico (Lado Esquerdo - MAIS LARGO) ---
        const chartY = titleHeight;
        const chartPadding = Math.max(width * 0.015, 8);
        const chartHeight = Math.max(contentSectionHeight * 0.75, 80);
        
        const chartGroup = mainGroup.append("g")
            .attr("transform", "translate(" + padding + ", " + chartY + ")");
        
        const valores = processedData.serieTemporal.valores;
        const periodos = processedData.serieTemporal.periodos;
        
        if (valores.length > 0) {
            // Calcula escala para os dados
            const minVal = d3.min(valores);
            const maxVal = d3.max(valores);
            const range = maxVal - minVal || 1;
            
            // Margem interna do gráfico responsiva
            const innerChartPadding = Math.max(chartWidth * 0.04, 10);
            const innerWidth = chartWidth - (innerChartPadding * 2);
            const innerHeight = chartHeight - (innerChartPadding * 2);
            
            // Prepara os dados para a linha
            const lineData = valores.map(function(valor, i) {
                const x = innerChartPadding + (innerWidth / Math.max(valores.length - 1, 1)) * i;
                const normalizedY = range > 0 ? (valor - minVal) / range : 0.5;
                const y = innerChartPadding + innerHeight * (1 - normalizedY);
                
                return {
                    x: x,
                    y: y,
                    value: valor,
                    period: periodos[i] || ("P" + (i + 1))
                };
            });
            
            // Desenha a linha principal - responsiva
            const line = d3.line()
                .x(function(d) { return d.x; })
                .y(function(d) { return d.y; })
                .curve(d3.curveMonotoneX);
            
            const strokeWidth = isCompactHorizontal ? 
                Math.min(Math.max(height * 0.02, 2), 5) : 
                Math.min(Math.max(width * 0.008, 3), 8);
            
            chartGroup.append("path")
                .datum(lineData)
                .attr("d", line)
                .attr("stroke", "#1A9850")
                .attr("stroke-width", strokeWidth)
                .attr("fill", "none")
                .attr("stroke-linecap", "round")
                .attr("opacity", 1);
            
            // Adiciona pontos na linha - tamanho responsivo COM TOOLTIP
            const pointRadius = isCompactHorizontal ? 
                Math.min(Math.max(height * 0.015, 2), 4) : 
                Math.min(Math.max(width * 0.005, 3), 7);
            
            chartGroup.selectAll(".data-point")
                .data(lineData)
                .enter()
                .append("circle")
                .attr("class", "data-point")
                .attr("cx", function(d) { return d.x; })
                .attr("cy", function(d) { return d.y; })
                .attr("r", pointRadius)
                .attr("fill", "#1A9850")
                .attr("stroke", "#ffffff")
                .attr("stroke-width", Math.max(pointRadius * 0.3, 1))
                .style("cursor", "pointer")
                .on("mouseenter", function(event, d) {
                    // Aumenta o tamanho do ponto no hover
                    d3.select(this)
                        .transition()
                        .duration(150)
                        .attr("r", pointRadius * 1.4);
                    
                    // Mostra o tooltip
                    showTooltip(event, d);
                })
                .on("mouseleave", function(event, d) {
                    // Volta ao tamanho original
                    d3.select(this)
                        .transition()
                        .duration(150)
                        .attr("r", pointRadius);
                    
                    // Esconde o tooltip
                    hideTooltip();
                })
                .on("mousemove", function(event, d) {
                    // Atualiza posição do tooltip
                    showTooltip(event, d);
                });
            
            // TAMANHO DE FONTE DOS ANOS (para equalizar com valores)
            const yearLabelFontSize = isCompactHorizontal ? 
                Math.min(Math.max(height * 0.08, 7), 12) : 
                Math.min(Math.max(height * 0.04, 10), width * 0.025, 15);
            
            // Adiciona os valores reais acima dos pontos - FORMATAÇÃO CORRETA
            chartGroup.selectAll(".value-label")
                .data(lineData)
                .enter()
                .append("text")
                .attr("class", "value-label")
                .attr("x", function(d) { return d.x; })
                .attr("y", function(d) { return d.y - Math.max(8, height * 0.015); })
                .attr("font-size", yearLabelFontSize + "px") // MESMO TAMANHO DOS ANOS
                .attr("fill", "#1a4f0e")
                .attr("text-anchor", "middle")
                .attr("font-weight", "700")
                .text(function(d) { 
                    // USA A FUNÇÃO DE FORMATAÇÃO PERSONALIZADA
                    return formatValue(d.value);
                });
            
            // Adiciona os anos/períodos abaixo do gráfico - fonte responsiva
            chartGroup.selectAll(".year-label")
                .data(lineData)
                .enter()
                .append("text")
                .attr("class", "year-label")
                .attr("x", function(d) { return d.x; })
                .attr("y", chartHeight + Math.max(12, height * 0.02))
                .attr("font-size", yearLabelFontSize + "px")
                .attr("fill", "#2d5016")
                .attr("text-anchor", "middle")
                .attr("font-weight", "600")
                .text(function(d) { return d.period; });
            
        } else {
            // Exibe mensagem quando não há dados temporais
            chartGroup.append("text")
                .attr("x", chartWidth / 2)
                .attr("y", chartHeight / 2)
                .attr("font-size", Math.min(Math.max(10, height * 0.02), width * 0.025) + "px")
                .attr("fill", "rgba(45,80,22,0.5)")
                .attr("text-anchor", "middle")
                .text("Sem dados temporais");
        }

        // --- Linha Separadora Vertical ---
        const separatorX = padding + chartWidth + (padding / 2);
        mainGroup.append("line")
            .attr("x1", separatorX)
            .attr("y1", chartY)
            .attr("x2", separatorX)
            .attr("y2", chartY + contentSectionHeight)
            .attr("stroke", "rgba(45,80,22,0.3)")
            .attr("stroke-width", 1);

        // --- Seção das Variações (Lado Direito - MAIS COMPACTA) ---
        const variationsX = separatorX + (padding / 2);
        const variationsGroup = mainGroup.append("g")
            .attr("transform", "translate(" + variationsX + ", " + chartY + ")");
        
        // Calcula espaçamento vertical para as variações OTIMIZADO PARA ESPAÇO MENOR
        const availableVariationsHeight = contentSectionHeight * 0.9;
        const variationBlockHeight = availableVariationsHeight / 3;
        const variationStartY = contentSectionHeight * 0.05;
        
        // Espaçamento entre label e valor adaptado ao formato COMPACTO
        const labelValueSpacing = isCompactHorizontal ? 
            Math.max(variationBlockHeight * 0.45, 12) : // Reduzido de 0.5 para 0.45
            Math.max(variationBlockHeight * 0.35, 20);  // Reduzido de 0.4 para 0.35
        
        // Centraliza horizontalmente na seção de variações
        const variationCenterX = variationsWidth / 2;
        
        // PRIMEIRA VARIAÇÃO: Variação no Período (em pontos percentuais)
        const variation1Y = variationStartY;
        
        // Nome da variação (em cima)
        variationsGroup.append("text")
            .attr("class", "secondary-label-text")
            .attr("x", variationCenterX)
            .attr("y", variation1Y)
            .attr("font-size", labelFontSize + "px")
            .text(processedData.valorPrincipal.label);

        // Valor da variação (embaixo, maior que o nome)
        variationsGroup.append("text")
            .attr("class", "secondary-value-text")
            .attr("x", variationCenterX)
            .attr("y", variation1Y + labelValueSpacing)
            .attr("font-size", valueFontSize + "px")
            .text(processedData.valorPrincipal.format(processedData.valorPrincipal.value));

        // SEGUNDA VARIAÇÃO: Variação vs Ano Anterior (em pontos percentuais)
        const variation2Y = variation1Y + variationBlockHeight;
        
        // Nome da variação (em cima)
        variationsGroup.append("text")
            .attr("class", "secondary-label-text")
            .attr("x", variationCenterX)
            .attr("y", variation2Y)
            .attr("font-size", labelFontSize + "px")
            .text(processedData.valorSecundario.label);
        
        // Valor da variação (embaixo, maior que o nome)
        variationsGroup.append("text")
            .attr("class", "secondary-value-text")
            .attr("x", variationCenterX)
            .attr("y", variation2Y + labelValueSpacing)
            .attr("font-size", valueFontSize + "px")
            .text(processedData.valorSecundario.format(processedData.valorSecundario.value));

        // TERCEIRA VARIAÇÃO: Média Anual (em pontos percentuais)
        const variation3Y = variation2Y + variationBlockHeight;
        
        // Nome da variação (em cima)
        variationsGroup.append("text")
            .attr("class", "secondary-label-text")
            .attr("x", variationCenterX)
            .attr("y", variation3Y)
            .attr("font-size", labelFontSize + "px")
            .text(processedData.valorTerciario.label);
        
        // Valor da variação (embaixo, maior que o nome)
        variationsGroup.append("text")
            .attr("class", "secondary-value-text")
            .attr("x", variationCenterX)
            .attr("y", variation3Y + labelValueSpacing)
            .attr("font-size", valueFontSize + "px")
            .text(processedData.valorTerciario.format(processedData.valorTerciario.value));
    }
}
</script>
</body>
</html>
